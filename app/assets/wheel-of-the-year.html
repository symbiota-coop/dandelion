<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel of the Year</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <!-- The site's Bootstrap and jQuery: the jQuery version and hash as frontend/package.json and integrity.json give them -->
  <link href="/stylesheets/bootstrap5.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0d0a06;
      --gold-rgb: 201, 168, 76;
      --gold: rgb(var(--gold-rgb));
      --gold-light: #e8c96a;
      --gold-dim: #8a6f2e;
      --cream: #f0e8d5;
      --cream-dim: #c4b89a;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'EB Garamond', serif;
      font-weight: 400; /* the site's Bootstrap sets 500 */
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Starfield */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255, 255, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 80%, rgba(255, 255, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 25%, rgba(255, 255, 255, 0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 70%, rgba(255, 255, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 10%, rgba(255, 255, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 40%, rgba(255, 255, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 90%, rgba(255, 255, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 62% 55%, rgba(255, 255, 220, 0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 65%, rgba(255, 255, 255, 0.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Header: the title on the left, the hemisphere on the right, over a gold rule */
    /* Wider than the site's Bootstrap .container-xl (1140px), so the panel has room beside a large wheel */
    header,
    main {
      max-width: 82.5rem;
      position: relative;
      z-index: 1;
    }

    header::after {
      content: '';
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--gold-dim), transparent);
    }

    header h1 {
      font-family: 'Uncial Antiqua', serif;
      font-weight: 400;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      color: var(--gold-light);
      letter-spacing: 0.08em;
      text-shadow: 0 0 40px rgba(var(--gold-rgb), 0.5), 0 2px 4px black;
      line-height: 1.2;
    }

    /* The page's quieter lines */
    header p,
    .panel-prompt p,
    .panel-alt,
    .panel-when {
      font-style: italic;
      color: var(--cream-dim);
    }

    header p,
    .panel-prompt p {
      letter-spacing: 0.05em;
    }

    /* Small labels, in Cinzel */
    .season-label,
    .sabbat-label,
    .today-date,
    .festival-type,
    .detail-label,
    .tradition-tag,
    .btn-hemi {
      font-family: 'Cinzel', serif;
    }

    .festival-type,
    .detail-label,
    .btn-hemi {
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .festival-type,
    .detail-label {
      font-size: 0.85rem;
    }

    /* === WHEEL === */
    #wheel-svg {
      display: block;
      width: 100%;
      max-width: max(20rem, min(44rem, 100vh - 9rem));
      height: auto;
      filter: drop-shadow(0 0 30px rgba(var(--gold-rgb), 0.12));
      overflow: visible;
    }

    #wheel-svg text {
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .wheel-face {
      fill: #0a0806;
      stroke: rgba(var(--gold-rgb), 0.2);
    }

    .ring {
      fill: none;
      stroke: rgba(var(--gold-rgb), 0.35);
      stroke-width: 1.5;
    }

    .ring.inner {
      stroke: rgba(var(--gold-rgb), 0.2);
      stroke-width: 0.8;
    }

    .spoke {
      stroke: rgba(var(--gold-rgb), 0.25);
      stroke-width: 0.8;
    }

    .tick {
      stroke: rgba(var(--gold-rgb), 0.5);
      stroke-width: 1.5;
    }

    .centre {
      fill: var(--bg);
      stroke: rgba(var(--gold-rgb), 0.5);
    }

    .segment-fill {
      stroke: var(--bg);
      stroke-width: 1.5;
    }

    .segment-rim {
      fill: none;
      stroke-width: 2.5;
      opacity: 0.6;
    }

    .segment-mark {
      opacity: 0.9;
    }

    .segment {
      transition: filter 0.25s;
      cursor: pointer;
    }

    .segment > * {
      transition: opacity 0.25s;
    }

    .segment:hover {
      filter: brightness(1.3);
    }

    .segment.active {
      filter: brightness(1.5) drop-shadow(0 0 10px currentColor);
    }

    /* The other festivals fade back, their names less than their colours so they stay readable */
    .segment.dimmed > :not(g) {
      opacity: 0.4;
    }

    .segment.dimmed > g {
      opacity: 0.6;
    }

    .season-label {
      font-size: 11px;
      fill: var(--cream-dim);
      letter-spacing: 0.05em;
    }

    .sabbat-label {
      font-size: 14px;
      fill: var(--cream);
      letter-spacing: 0.05em;
    }

    .sabbat-date {
      font-family: 'EB Garamond', serif;
      font-size: 12px;
      fill: var(--cream-dim);
      letter-spacing: 0.04em;
    }

    /* Today, in the centre: the weekday, the date and the next festival */
    .today-weekday,
    .today-next {
      font-family: 'EB Garamond', serif;
    }

    .today-weekday,
    .today-date {
      fill: var(--gold-light);
    }

    .today-weekday {
      font-size: 14px;
      font-variant-caps: all-small-caps;
      letter-spacing: 0.1em;
    }

    .today-date {
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .today-date .ordinal {
      font-size: 0.7em;
    }

    .today-next {
      font-size: 12px;
      font-style: italic;
      fill: var(--cream-dim);
    }

    .today-marker {
      pointer-events: none;
    }

    .today-marker line {
      stroke: var(--gold-light);
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0.85;
    }

    .today-marker circle {
      fill: var(--gold-light);
      stroke: var(--bg);
      stroke-width: 1.5;
    }

    .segment:focus {
      outline: none;
    }

    .segment:focus-visible .segment-fill {
      stroke: var(--gold-light);
      stroke-width: 2.5;
    }

    /* === INFO PANEL === */
    .info-panel {
      background: linear-gradient(145deg, rgba(20, 17, 10, 0.95), rgba(14, 12, 8, 0.98));
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      padding: 2rem;
      position: sticky;
      top: 1.5rem;
      min-height: 390px;
      scroll-margin-top: 1rem;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(var(--gold-rgb), 0.1);
      transition: border-color 0.4s;
    }

    .info-panel.has-selection {
      border-color: var(--gold);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(var(--gold-rgb), 0.08), inset 0 1px 0 rgba(var(--gold-rgb), 0.15);
    }

    .panel-prompt {
      min-height: 350px;
      color: var(--cream-dim);
    }

    .panel-prompt .prompt-symbol {
      font-size: 3rem;
      opacity: 0.3;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.25;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(1.05);
      }
    }

    .panel-prompt p {
      line-height: 1.6;
      max-width: 260px;
    }

    .panel-content {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel-header {
      border-bottom: 1px solid rgba(var(--gold-rgb), 0.2);
    }

    .panel-icon {
      font-size: 2.8rem;
      line-height: 1;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .panel-name {
      font-family: 'Uncial Antiqua', serif;
      font-weight: 400;
      font-size: 1.55rem;
      color: var(--gold-light);
      line-height: 1.15;
      text-shadow: 0 0 20px rgba(var(--gold-rgb), 0.4);
    }

    .panel-alt {
      font-size: 1rem;
      margin-top: 0.15rem;
    }

    /* On Bootstrap's .badge */
    .festival-type {
      font-weight: 400;
      border-radius: 2px;
    }

    .festival-type.cross {
      background: rgba(var(--gold-rgb), 0.15);
      color: var(--gold);
      border: 1px solid var(--gold-dim);
    }

    .festival-type.solar {
      background: rgba(255, 200, 80, 0.1);
      color: #f0c040;
      border: 1px solid rgba(240, 192, 64, 0.4);
    }

    .panel-body {
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(var(--gold-rgb), 0.12);
      border-radius: 3px;
      padding: 0.6rem 0.8rem;
    }

    .detail-label {
      color: var(--gold-dim);
      margin-bottom: 0.25rem;
    }

    .detail-value {
      font-size: 1rem;
      color: var(--cream-dim);
      line-height: 1.4;
    }

    .tradition-tag {
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      color: var(--cream-dim);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      padding: 0.2rem 0.6rem;
    }

    /* Hemisphere toggle: a Bootstrap button group in the page's gold */
    .btn-hemi {
      --bs-btn-color: var(--cream-dim);
      --bs-btn-bg: rgba(255, 255, 255, 0.03);
      --bs-btn-border-color: var(--gold-dim);
      --bs-btn-hover-color: var(--cream);
      --bs-btn-hover-bg: rgba(var(--gold-rgb), 0.15);
      --bs-btn-hover-border-color: var(--gold-dim);
      --bs-btn-active-color: var(--bg);
      --bs-btn-active-bg: var(--gold-dim);
      --bs-btn-active-border-color: var(--gold-dim);
      --bs-btn-border-radius: 3px;
      font-size: 0.8rem;
      padding: 0.4rem 1.2rem;
    }

    .btn-hemi:focus-visible {
      outline: 1px solid var(--gold-light);
      outline-offset: 2px;
    }

    .panel-when {
      font-size: 1.05rem;
      margin-top: 0.15rem;
    }

    .panel-when strong {
      font-style: normal;
      font-weight: 500;
      color: var(--gold-light);
    }

    /* Beside the panel: a set size, no taller than the window below the header and leaving the panel room, and the
       panel takes the rest of the row */
    @media (min-width: 992px) {
      #wheel-svg {
        width: max(20rem, min(44rem, 100vh - 9rem, 50vw));
      }
    }

    @media (max-width: 575.98px) {
      .info-panel {
        padding: 1.5rem;
      }

      /* Phones: the wheel reaches into the page's side margins */
      #wheel-svg {
        width: calc(100% + 1.5rem);
        max-width: none;
        margin: 0 -0.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .panel-prompt .prompt-symbol,
      .panel-content {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <header class="container-fluid px-3 py-3 py-sm-4 mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div>
      <h1 class="mb-1">Wheel of the Year</h1>
      <p class="mb-0">Eight seasonal festivals marking the turning of the year</p>
    </div>
    <div class="btn-group" role="group" aria-label="Hemisphere">
      <button type="button" class="btn btn-hemi" data-hemisphere="north" aria-pressed="true">&#8679; Northern</button>
      <button type="button" class="btn btn-hemi" data-hemisphere="south" aria-pressed="false">&#8681; Southern</button>
    </div>
  </header>

  <main class="container-fluid px-3 pb-5">
    <div class="row g-4">
      <!-- At the top of its column, so a longer description beside it doesn't push it down -->
      <div class="col-lg-auto d-flex justify-content-center align-items-start">
        <svg id="wheel-svg" viewBox="-254 -254 508 508" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="The eight festivals, clockwise from Yule"></svg>
      </div>

      <div class="col-lg">
        <div class="info-panel" id="info-panel" aria-live="polite">
          <div id="panel-prompt">
            <div class="panel-prompt d-flex flex-column align-items-center justify-content-center gap-3 text-center">
              <div class="prompt-symbol">☽ ✦ ☾</div>
              <p class="mb-0">Click any segment of the Wheel to explore the eight festivals of the year. The gold hand shows where we are today</p>
            </div>
          </div>
          <div class="panel-content" id="panel-content" style="display: none"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Each festival's text, colours and icon. Their names, order (clockwise from Yule at the top, 45° apart), kinds
    // and traditional dates come from lib/almanac.rb
    const FESTIVAL_TEXT = {
      yule: {
        alt: 'Winter Solstice',
        icon: '❄️',
        color: '#6ab4c8',
        colorDark: '#2a6a88',
        desc: 'Yule marks the longest night and the rebirth of the Sun. As the wheel turns and light begins its slow return, ancients lit great bonfires to welcome the returning king of light. The world holds its breath, then exhales into the growing dawn.',
        traditions: ['Holly & Oak Kings', 'Yule Log', 'Evergreens', 'Candle Vigils'],
        themes: 'Rebirth, Light returning, Hope',
      },
      imbolc: {
        alt: "Brigid's Day · Candlemas",
        icon: '🕯️',
        color: '#c8a0d8',
        colorDark: '#6a3a88',
        desc: 'Imbolc means "in the belly," honoring the first stirrings of spring within the frozen earth. Sacred to Brigid, goddess of fire, healing, and poetry, this festival celebrates the return of fertility and the quickening of the land under snow.',
        traditions: ['Brigid Crosses', 'Candle Blessing', 'Fire Divination', 'Spring Cleaning'],
        themes: 'Awakening, Purification, New beginnings',
      },
      ostara: {
        alt: 'Spring Equinox',
        icon: '🌸',
        color: '#c06080',
        colorDark: '#803050',
        desc: 'At Ostara, day and night stand in perfect balance before light triumphs. Named for the Germanic dawn goddess Ēostre, this is a festival of fertility, seeds, and new life. Hares run wild, eggs are hidden, and the world blooms into color.',
        traditions: ['Egg Decoration', 'Seed Planting', 'Balance Rituals', 'Dawn Vigil'],
        themes: 'Balance, Fertility, New growth',
      },
      beltane: {
        alt: 'May Day',
        icon: '🔥',
        color: '#e07020',
        colorDark: '#904010',
        desc: 'Beltane blazes with the full fire of spring becoming summer. Fires were lit on every hill; cattle driven between them for protection. Maypoles rose as symbols of sacred union, and the veil between worlds thinned, inviting the fae to walk among us.',
        traditions: ['Beltane Fires', 'Maypole Dance', 'Green Man', 'Handfasting'],
        themes: 'Passion, Union, Fertility at peak',
      },
      litha: {
        alt: 'Midsummer · Summer Solstice',
        icon: '☀️',
        color: '#d4a020',
        colorDark: '#8a6010',
        desc: 'Litha is the zenith — the longest day, when the Sun pauses at the height of its power before beginning its slow descent. Midsummer bonfires burned through the night; faeries were said to roam freely. It is a moment of radiant fullness before the waning begins.',
        traditions: ['Midsummer Bonfires', 'Flower Crowns', 'Well Dressing', 'Sun Wheels'],
        themes: 'Fullness, Power, Celebration before waning',
      },
      lughnasadh: {
        alt: 'Lammas · First Harvest',
        icon: '🌾',
        color: '#a0b030',
        colorDark: '#507010',
        desc: 'Lughnasadh, named for the god Lugh, marks the first harvest — grain cut, bread baked from new wheat. It is a time of both abundance and bittersweet awareness: the Sun King weakens as the harvest grows. Games, feasting, and sacrifice honored the turning year.',
        traditions: ['Bread Baking', 'Grain Dollies', 'Harvest Games', 'Offerings to Lugh'],
        themes: 'First harvest, Sacrifice, Abundance',
      },
      mabon: {
        alt: 'Autumn Equinox',
        icon: '🍂',
        color: '#b05820',
        colorDark: '#703010',
        desc: 'Mabon brings the second balance point of the year as darkness begins to gain. The second harvest is gathered; leaves catch flame in amber and crimson. Named for the Welsh divine child, this equinox invites gratitude for what has been reaped and release of what must fall.',
        traditions: ['Apple Harvest', 'Gratitude Altars', 'Ancestor Honoring', 'Wine Making'],
        themes: 'Balance, Gratitude, Preparation for darkness',
      },
      samhain: {
        alt: 'All Hallows · Ancestor Night',
        icon: '🌑',
        color: '#7040b0',
        colorDark: '#3a1870',
        desc: 'Samhain is the great hinge of the year — the end and the beginning, when the veil between the living and the dead grows thin as gossamer. The final harvest is brought in, the last fires extinguished and relit from the sacred flame. Ancestors are welcomed home.',
        traditions: ['Dumb Supper', 'Jack-o-Lanterns', 'Ancestor Altars', 'Divination'],
        themes: 'Death, Transition, Ancestral communion',
      },
    };

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const DAY = 1000 * 60 * 60 * 24;

    // Timezones south of the equator, for guessing the hemisphere on a first visit
    const SOUTHERN_TIMEZONES = /^(Australia|Antarctica)\/|^Pacific\/(Auckland|Chatham|Fiji|Tongatapu|Apia|Noumea|Efate|Port_Moresby)|^America\/(Argentina|Santiago|Sao_Paulo|Montevideo|Asuncion|La_Paz|Lima|Punta_Arenas)|^Africa\/(Johannesburg|Maputo|Harare|Windhoek|Gaborone|Lusaka|Maseru|Mbabane|Blantyre|Lubumbashi|Luanda|Dar_es_Salaam)|^Indian\/(Mauritius|Reunion|Antananarivo)|^Atlantic\/Stanley/;

    function storedHemisphere () {
      try {
        const stored = localStorage.getItem('wheel-of-the-year-hemisphere');
        if (stored === 'north' || stored === 'south') return stored;
      } catch (e) { /* storage unavailable */ }
      try {
        if (SOUTHERN_TIMEZONES.test(Intl.DateTimeFormat().resolvedOptions().timeZone)) return 'south';
      } catch (e) { /* no Intl */ }
      return 'north';
    }

    let hemisphere = storedHemisphere();

    const svg = document.getElementById('wheel-svg');
    const $infoPanel = $('#info-panel');
    const $panelPrompt = $('#panel-prompt');
    const $panelContent = $('#panel-content');

    const R_OUTER = 240;
    const R_RING = 140;
    const R_INNER = 70;

    function svgEl (tag, attrs, text) {
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function draw (parent, tag, attrs, text) {
      return parent.appendChild(svgEl(tag, attrs, text));
    }

    function polarToXY (angleDeg, r) {
      // 0 deg = top, clockwise
      const rad = (angleDeg - 90) * Math.PI / 180;
      return [r * Math.cos(rad), r * Math.sin(rad)];
    }

    function describeArc (cx, cy, r, startAngle, endAngle) {
      const [x1, y1] = polarToXY(startAngle, r);
      const [x2, y2] = polarToXY(endAngle, r);
      const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
      return `M ${cx + x1} ${cy + y1} A ${r} ${r} 0 ${largeArc} 1 ${cx + x2} ${cy + y2}`;
    }

    // === DATES ===

    // Every festival from two years back to two years on, in order, from lib/almanac.rb
    // A cross-quarter day falls on its traditional date, in the viewer's timezone, with its astronomical midpoint beside it
    function festivalTimeline (hemi) {
      return almanac.timeline[hemi].map(o => ({
        index: sabbats.findIndex(s => s.id === o.id),
        date: o.date ? new Date(`${o.date}T00:00`) : new Date(o.at),
        midpoint: o.date && new Date(o.at),
      }));
    }

    function startOfDay (date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    // Whole calendar days from today to date, in the viewer's timezone
    function daysFromToday (date) {
      return Math.round((startOfDay(date) - startOfDay(new Date())) / DAY);
    }

    function relativeDays (days) {
      if (days === 0) return 'today';
      if (days === 1) return 'tomorrow';
      if (days === -1) return 'yesterday';
      return days > 0 ? `in ${days} days` : `${-days} days ago`;
    }

    const shortWeekdayFormat = new Intl.DateTimeFormat('en-GB', { weekday: 'short' });
    const shortDateFormat = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
    const monthFormat = new Intl.DateTimeFormat('en-GB', { month: 'long' });
    const ordinalRules = new Intl.PluralRules('en-GB', { type: 'ordinal' });
    const ORDINAL_SUFFIXES = { one: 'st', two: 'nd', few: 'rd', other: 'th' };

    // 21 → 'st'
    function ordinalSuffix (day) {
      return ORDINAL_SUFFIXES[ordinalRules.select(day)];
    }

    // Long dates have ordinal days: Sat, 31st October 2026
    function longDate (date) {
      return `${shortWeekdayFormat.format(date)}, ${date.getDate()}${ordinalSuffix(date.getDate())} ${monthFormat.format(date)} ${date.getFullYear()}`;
    }
    const weekdayFormat = new Intl.DateTimeFormat('en-GB', { weekday: 'long' });

    // The festival's next date, counting today
    function nextOccurrence (index) {
      return timeline.find(o => o.index === index && daysFromToday(o.date) >= 0);
    }

    // Where today falls on the wheel, between the last festival and the next
    function todayAngle () {
      const now = new Date();
      const i = timeline.findIndex(o => o.date > now);
      const prev = timeline[i - 1];
      const next = timeline[i];
      const fraction = (now - prev.date) / (next.date - prev.date);
      return 45 * (prev.index + fraction);
    }

    let almanac;
    let sabbats;
    let timeline;

    // === WHEEL ===

    function createSegment (sabbat, index) {
      const angle = index * 45;
      const startAngle = angle - 22.5;
      const endAngle = angle + 22.5;

      const [ox1, oy1] = polarToXY(startAngle, R_OUTER);
      const [ox2, oy2] = polarToXY(endAngle, R_OUTER);
      const [ix1, iy1] = polarToXY(startAngle, R_RING);
      const [ix2, iy2] = polarToXY(endAngle, R_RING);

      const path = `M ${ox1} ${oy1} A ${R_OUTER} ${R_OUTER} 0 0 1 ${ox2} ${oy2} L ${ix2} ${iy2} A ${R_RING} ${R_RING} 0 0 0 ${ix1} ${iy1} Z`;

      const g = svgEl('g', {
        class: 'segment',
        tabindex: '0',
        role: 'button',
        'aria-pressed': 'false',
        'aria-label': `${sabbat.name}, ${sabbat.alt}`,
        'data-id': sabbat.id,
      });

      draw(g, 'path', { d: path, class: 'segment-fill', fill: sabbat.colorDark });

      // Gradient overlay
      const gradId = `grad-${sabbat.id}`;
      const grad = draw(svg.querySelector('defs'), 'radialGradient', { id: gradId });
      draw(grad, 'stop', { offset: '0%', 'stop-color': sabbat.color, 'stop-opacity': '0.3' });
      draw(grad, 'stop', { offset: '100%', 'stop-color': sabbat.color, 'stop-opacity': '0' });
      draw(g, 'path', { d: path, fill: `url(#${gradId})` });

      // Rim arc highlight
      draw(g, 'path', { d: describeArc(0, 0, R_OUTER - 1, startAngle + 0.5, endAngle - 0.5), class: 'segment-rim', stroke: sabbat.color });

      // Type indicator (solar = diamond, cross-quarter = circle) at mid-outer edge
      const [mx, my] = polarToXY(angle, R_OUTER - 12);
      if (sabbat.type === 'solar') {
        draw(g, 'rect', { x: mx - 5, y: my - 5, width: 10, height: 10, transform: `rotate(45, ${mx}, ${my})`, class: 'segment-mark', fill: sabbat.color });
      } else {
        draw(g, 'circle', { cx: mx, cy: my, r: 5, class: 'segment-mark', fill: sabbat.color });
      }

      // Name and next date, along the spoke, turned the right way up in the lower half of the wheel
      const [lx, ly] = polarToXY(angle, (R_RING + R_OUTER) / 2 - 12);
      const upright = angle > 90 && angle < 270 ? angle + 180 : angle;
      const textG = draw(g, 'g', { transform: `translate(${lx}, ${ly}) rotate(${upright})` });
      draw(textG, 'text', { class: 'sabbat-label', y: -8 }, sabbat.name.toUpperCase());
      draw(textG, 'text', { class: 'sabbat-label sabbat-date', y: 11 });

      $(g).on('click', () => {
        selectSabbat(index);
        // With the panel under the wheel (below Bootstrap's lg), take the reader to it
        if (activeIndex === index && window.matchMedia('(max-width: 991.98px)').matches) {
          const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          $infoPanel[0].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        }
      }).on('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectSabbat(index);
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          const step = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
          const next = (index + step + sabbats.length) % sabbats.length;
          segments().eq(next).trigger('focus');
          selectSabbat(next, { keep: true });
        } else if (e.key === 'Escape' && activeIndex !== null) {
          selectSabbat(activeIndex);
        }
      });
      return g;
    }

    function segments () {
      return $(svg).find('.segment');
    }

    function buildWheel () {
      draw(svg, 'defs');
      draw(svg, 'circle', { r: R_OUTER, class: 'wheel-face' });
      draw(svg, 'circle', { r: R_RING, class: 'ring' });
      draw(svg, 'circle', { r: R_INNER, class: 'ring inner' });

      // Spokes between the festivals
      for (let i = 0; i < 8; i++) {
        const [x1, y1] = polarToXY(i * 45 - 22.5, R_INNER);
        const [x2, y2] = polarToXY(i * 45 - 22.5, R_OUTER);
        draw(svg, 'line', { x1, y1, x2, y2, class: 'spoke' });
      }

      sabbats.forEach((s, i) => svg.appendChild(createSegment(s, i)));

      // Season names halfway across the inner ring, along it like the festivals' names
      [[0, 'WINTER'], [90, 'SPRING'], [180, 'SUMMER'], [270, 'AUTUMN']].forEach(([angle, season]) => {
        const [sx, sy] = polarToXY(angle, (R_INNER + R_RING) / 2);
        draw(svg, 'text', { class: 'season-label', transform: `translate(${sx}, ${sy}) rotate(${angle === 180 ? 0 : angle})` }, season);
      });

      // Solstice ticks, just inside the festivals
      [0, 180].forEach(angle => {
        const [x1, y1] = polarToXY(angle, R_RING - 8);
        const [x2, y2] = polarToXY(angle, R_RING);
        draw(svg, 'line', { x1, y1, x2, y2, class: 'tick' });
      });

      // Today's hand, from the centre out to the rim
      const marker = draw(svg, 'g', { class: 'today-marker', id: 'today-marker' });
      draw(marker, 'line', { y1: -R_INNER, y2: -(R_OUTER + 6) });
      draw(marker, 'circle', { cy: -(R_OUTER + 6), r: 4.5 });
      draw(marker, 'title', {}, 'Today');

      // Centre, with today: what the hand points at
      const now = new Date();
      draw(svg, 'circle', { r: R_INNER, class: 'centre' });
      draw(svg, 'text', { y: -24, class: 'today-weekday' }, weekdayFormat.format(now));
      const date = draw(svg, 'text', { class: 'today-date' }, now.getDate());
      draw(date, 'tspan', { class: 'ordinal' }, ordinalSuffix(now.getDate()));
      date.append(` ${monthFormat.format(now)}`);
      draw(svg, 'text', { y: 25, class: 'today-next', id: 'today-next' });
    }

    // Everything that depends on the hemisphere: the dates under the names, today's hand and the next festival in the
    // centre
    function updateDates () {
      timeline = festivalTimeline(hemisphere);

      segments().each((i, g) => {
        $(g).find('.sabbat-date').text(shortDateFormat.format(nextOccurrence(i).date));
      });

      $('#today-marker').attr('transform', `rotate(${todayAngle()})`);

      const next = timeline.find(o => daysFromToday(o.date) >= 0);
      const days = daysFromToday(next.date);
      const name = sabbats[next.index].name;
      $('#today-next').text(days === 0 ? `Happy ${name}!` : `${days === 1 ? '1 day' : `${days} days`} to ${name}`);
    }

    let activeIndex = null;

    function clearSelection () {
      activeIndex = null;
      segments().removeClass('active dimmed').attr('aria-pressed', 'false');
      $infoPanel.removeClass('has-selection');
      $panelPrompt.show();
      $panelContent.hide();
      history.replaceState(null, '', location.pathname + location.search);
    }

    function selectSabbat (index, { keep } = {}) {
      if (activeIndex === index && !keep) {
        clearSelection();
        return;
      }
      activeIndex = index;

      segments().each((i, g) => {
        $(g).toggleClass('active', i === index).toggleClass('dimmed', i !== index).attr('aria-pressed', i === index ? 'true' : 'false');
      });

      const s = sabbats[index];
      const next = nextOccurrence(index);
      const days = daysFromToday(next.date);
      const when = `<strong>${longDate(next.date)}</strong> · ${relativeDays(days)}`;
      const whenLines = s.type === 'solar'
        ? `<div class="panel-when">${when}</div>`
        : `<div class="panel-when">${when}</div>
           <div class="panel-when">Traditionally ${s.traditional[hemisphere]} · astronomical midpoint ${shortDateFormat.format(next.midpoint)}</div>`;

      $infoPanel.addClass('has-selection');
      $panelPrompt.hide();

      // The festivals' text is the page's own, above
      $panelContent.html(`
        <div class="d-flex flex-column gap-3">
          <div class="panel-header d-flex align-items-start gap-3 pb-3">
            <div class="panel-icon flex-shrink-0" style="color:${s.color}">${s.icon}</div>
            <div>
              <div class="panel-name">${s.name}</div>
              <div class="panel-alt">${s.alt}</div>
              <span class="badge festival-type ${s.type} mt-2">${s.type === 'solar' ? '◈ Solar Festival' : '● Cross-Quarter Day'}</span>
            </div>
          </div>
          <div>${whenLines}</div>
          <div class="panel-body">${s.desc}</div>
          <div class="detail-item">
            <div class="detail-label">Themes</div>
            <div class="detail-value">${s.themes}</div>
          </div>
          <div>
            <div class="detail-label">Traditions</div>
            <div class="d-flex flex-wrap gap-2 mt-2">${s.traditions.map(t => `<span class="tradition-tag">${t}</span>`).join('')}</div>
          </div>
        </div>
      `).show();
      history.replaceState(null, '', `#${s.id}`);
    }

    function setHemisphere (hemi) {
      if (hemisphere === hemi) return;
      hemisphere = hemi;
      try { localStorage.setItem('wheel-of-the-year-hemisphere', hemi); } catch (e) { /* storage unavailable */ }
      showHemisphere();
    }

    function showHemisphere () {
      $('.btn-hemi').each((i, btn) => {
        const on = $(btn).data('hemisphere') === hemisphere;
        $(btn).toggleClass('active', on).attr('aria-pressed', on ? 'true' : 'false');
      });
      updateDates();
      if (activeIndex !== null) selectSabbat(activeIndex, { keep: true });
    }

    $('.btn-hemi').on('click', function () {
      setHemisphere($(this).data('hemisphere'));
    });

    // The festivals and their dates, from lib/almanac.rb
    $.getJSON('/wheel-of-the-year.json', data => {
      almanac = data;
      sabbats = data.festivals.map(f => ({ ...f, type: f.traditional ? 'cross' : 'solar', ...FESTIVAL_TEXT[f.id] }));
      buildWheel();
      showHemisphere();

      // Open the festival in the URL (#samhain), or else the next one
      const linked = sabbats.findIndex(s => `#${s.id}` === location.hash);
      selectSabbat(linked >= 0 ? linked : timeline.find(o => daysFromToday(o.date) >= 0).index);
    });
  </script>
</body>

</html>
