<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel of the Year</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0a06;
      --bg2: #12100a;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --gold-dim: #8a6f2e;
      --cream: #f0e8d5;
      --cream-dim: #c4b89a;
      --ember: #c0522a;
      --frost: #6ab4c8;
      --leaf: #5a8a3c;
      --bloom: #c06080;
      --shadow: rgba(0, 0, 0, 0.8);
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'EB Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Starfield */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255, 255, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 80%, rgba(255, 255, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 25%, rgba(255, 255, 255, 0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 70%, rgba(255, 255, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 10%, rgba(255, 255, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 40%, rgba(255, 255, 255, 0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 90%, rgba(255, 255, 255, 0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 62% 55%, rgba(255, 255, 220, 0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 5% 65%, rgba(255, 255, 255, 0.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      text-align: center;
      padding: 3rem 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    header h1 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      color: var(--gold-light);
      letter-spacing: 0.08em;
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.5), 0 2px 4px black;
      line-height: 1.2;
    }

    header p {
      margin-top: 0.8rem;
      font-size: 1.05rem;
      color: var(--cream-dim);
      font-style: italic;
      letter-spacing: 0.05em;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr minmax(300px, 460px);
      gap: 2.5rem;
      width: 100%;
      max-width: 1200px;
      padding: 1rem 2rem 0;
      position: relative;
      z-index: 1;
      align-items: stretch;
    }

    @media (max-width: 860px) {
      .main-layout {
        grid-template-columns: 1fr;
        padding-bottom: 4rem;
      }
    }

    /* === WHEEL === */
    .wheel-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 0;
      align-self: stretch;
    }

    #wheel-svg {
      width: 100%;
      max-width: 490px;
      height: auto;
      filter: drop-shadow(0 0 30px rgba(201, 168, 76, 0.12));
      cursor: pointer;
      overflow: visible;
    }

    .segment {
      transition: filter 0.25s, opacity 0.25s;
      cursor: pointer;
    }

    .segment:hover {
      filter: brightness(1.3);
    }

    .segment.active {
      filter: brightness(1.5) drop-shadow(0 0 10px currentColor);
    }

    .segment.dimmed {
      opacity: 0.45;
    }

    .season-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      fill: var(--cream-dim);
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      letter-spacing: 0.12em;
    }

    .sabbat-label {
      font-family: 'Cinzel', serif;
      font-size: 9.5px;
      fill: var(--cream);
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      letter-spacing: 0.05em;
    }

    .sabbat-date {
      font-family: 'EB Garamond', serif;
      font-size: 8.5px;
      font-style: italic;
      fill: var(--cream-dim);
      letter-spacing: 0.04em;
    }

    .center-circle text {
      font-family: 'Cinzel Decorative', cursive;
      fill: var(--gold-light);
      text-anchor: middle;
      dominant-baseline: middle;
    }

    /* === INFO PANEL === */
    .info-panel {
      background: linear-gradient(145deg, rgba(20, 17, 10, 0.95), rgba(14, 12, 8, 0.98));
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      padding: 2rem;
      position: sticky;
      top: 1.5rem;
      height: 100%;
      align-self: stretch;
      min-height: 390px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(201, 168, 76, 0.1);
      transition: border-color 0.4s;
    }

    .info-panel.has-selection {
      border-color: var(--gold);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(201, 168, 76, 0.08), inset 0 1px 0 rgba(201, 168, 76, 0.15);
    }

    .panel-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 350px;
      text-align: center;
      color: var(--cream-dim);
      gap: 1rem;
      opacity: 1;
      transition: opacity 0.3s;
    }

    .panel-prompt.hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    .panel-prompt .prompt-symbol {
      font-size: 3rem;
      opacity: 0.3;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: 0.25;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(1.05);
      }
    }

    .panel-prompt p {
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0.05em;
      line-height: 1.6;
      max-width: 260px;
    }

    .panel-content {
      display: none;
      flex-direction: column;
      gap: 1rem;
      animation: fadeIn 0.4s ease;
    }

    .panel-content.visible {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(201, 168, 76, 0.2);
    }

    .panel-icon {
      font-size: 2.8rem;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .panel-date {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .panel-name {
      font-family: 'Cinzel Decorative', cursive;
      font-size: 1.55rem;
      color: var(--gold-light);
      line-height: 1.15;
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.4);
    }

    .panel-alt {
      font-style: italic;
      font-size: 0.88rem;
      color: var(--cream-dim);
      margin-top: 0.15rem;
    }

    .panel-type-badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.2rem 0.7rem;
      border-radius: 2px;
      margin-top: 0.5rem;
    }

    .badge-cross {
      background: rgba(201, 168, 76, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold-dim);
    }

    .badge-solar {
      background: rgba(255, 200, 80, 0.1);
      color: #f0c040;
      border: 1px solid rgba(240, 192, 64, 0.4);
    }

    .panel-body {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--cream);
    }

    .panel-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-top: 0.5rem;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(201, 168, 76, 0.12);
      border-radius: 3px;
      padding: 0.6rem 0.8rem;
    }

    .detail-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 0.25rem;
    }

    .detail-value {
      font-size: 0.88rem;
      color: var(--cream-dim);
      line-height: 1.4;
    }

    .traditions-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.8rem;
    }

    .tradition-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--cream-dim);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      padding: 0.2rem 0.6rem;
    }

    /* Decorative rule */
    .rule {
      width: 100%;
      max-width: 400px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Hemisphere toggle */
    .hemisphere-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      position: relative;
      z-index: 1;
      margin: 1rem auto 0;
    }

    .hemisphere-toggle {
      display: flex;
      align-items: stretch;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--gold-dim);
      border-radius: 3px;
      overflow: hidden;
    }

    .hemi-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.45rem 1.2rem;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--cream-dim);
      transition: background 0.2s, color 0.2s;
    }

    .hemi-btn.active {
      background: var(--gold-dim);
      color: #0d0a06;
    }

    .hemi-divider {
      width: 1px;
      background: var(--gold-dim);
      align-self: stretch;
    }

    .hemi-btn:focus-visible,
    .now-line button:focus-visible {
      outline: 1px solid var(--gold-light);
      outline-offset: 2px;
    }

    /* Today: the moon and the next festival */
    .now-line {
      position: relative;
      z-index: 1;
      margin-top: 0.9rem;
      font-size: 1rem;
      color: var(--cream-dim);
      text-align: center;
      padding: 0 1rem;
    }

    .now-line button {
      font: inherit;
      color: var(--gold-light);
      background: none;
      border: none;
      border-bottom: 1px dotted var(--gold-dim);
      cursor: pointer;
      padding: 0;
    }

    .today-marker {
      pointer-events: none;
    }

    .segment:focus {
      outline: none;
    }

    .segment:focus-visible .segment-fill {
      stroke: var(--gold-light);
      stroke-width: 2.5;
    }

    .panel-when {
      font-size: 0.92rem;
      font-style: italic;
      color: var(--cream-dim);
      margin-top: 0.15rem;
    }

    .panel-when strong {
      font-style: normal;
      font-weight: 500;
      color: var(--gold-light);
    }

    @media (prefers-reduced-motion: reduce) {

      .panel-prompt .prompt-symbol,
      .panel-content {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Wheel of the Year</h1>
    <p>Eight seasonal festivals marking the turning of the year</p>
    <div class="now-line" id="now-line"></div>
  </header>

  <div class="rule"></div>

  <div class="hemisphere-row">
    <div class="hemisphere-toggle" role="group" aria-label="Hemisphere">
      <button class="hemi-btn active" id="btn-nh" aria-pressed="true" onclick="setHemisphere('north')">&#8679; Northern Hemisphere</button>
      <div class="hemi-divider"></div>
      <button class="hemi-btn" id="btn-sh" aria-pressed="false" onclick="setHemisphere('south')">&#8681; Southern Hemisphere</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="wheel-container">
      <svg id="wheel-svg" viewBox="-260 -260 520 520" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="The eight festivals, clockwise from Yule"></svg>
    </div>

    <div class="info-panel" id="info-panel" aria-live="polite">
      <div class="panel-prompt" id="panel-prompt">
        <div class="prompt-symbol">☽ ✦ ☾</div>
        <p>Click any segment of the Wheel to explore the eight festivals of the year. The gold hand shows where we are today</p>
      </div>
      <div class="panel-content" id="panel-content"></div>
    </div>
  </div>

  <script>
    // 8 sabbats, starting from Yule (Winter Solstice) at top, going clockwise
    // Angles: 0 = top, clockwise. Each sabbat 45° apart.
    // Order clockwise from top: Yule, Imbolc, Ostara, Beltane, Litha, Lughnasadh, Mabon, Samhain
    const sabbats = [
      {
        id: 'yule',
        name: 'Yule',
        alt: 'Winter Solstice',
        type: 'solar',
        event: 'december_solstice',
        angle: 0,
        icon: '❄️',
        color: '#6ab4c8',
        colorDark: '#2a6a88',
        desc: 'Yule marks the longest night and the rebirth of the Sun. As the wheel turns and light begins its slow return, ancients lit great bonfires to welcome the returning king of light. The world holds its breath, then exhales into the growing dawn.',
        traditions: ['Holly & Oak Kings', 'Yule Log', 'Evergreens', 'Candle Vigils'],
        themes: 'Rebirth, Light returning, Hope',
        element: 'Earth & Fire',
        direction: 'North',
      },
      {
        id: 'imbolc',
        name: 'Imbolc',
        alt: "Brigid's Day · Candlemas",
        type: 'cross',
        traditional: { north: '1–2 February', south: '1–2 August' },
        angle: 45,
        icon: '🕯️',
        color: '#c8a0d8',
        colorDark: '#6a3a88',
        desc: 'Imbolc means "in the belly," honoring the first stirrings of spring within the frozen earth. Sacred to Brigid, goddess of fire, healing, and poetry, this festival celebrates the return of fertility and the quickening of the land under snow.',
        traditions: ['Brigid Crosses', 'Candle Blessing', 'Fire Divination', 'Spring Cleaning'],
        themes: 'Awakening, Purification, New beginnings',
        element: 'Fire & Water',
        direction: 'Northeast',
      },
      {
        id: 'ostara',
        name: 'Ostara',
        alt: 'Spring Equinox',
        type: 'solar',
        event: 'march_equinox',
        angle: 90,
        icon: '🌸',
        color: '#c06080',
        colorDark: '#803050',
        desc: 'At Ostara, day and night stand in perfect balance before light triumphs. Named for the Germanic dawn goddess Ēostre, this is a festival of fertility, seeds, and new life. Hares run wild, eggs are hidden, and the world blooms into color.',
        traditions: ['Egg Decoration', 'Seed Planting', 'Balance Rituals', 'Dawn Vigil'],
        themes: 'Balance, Fertility, New growth',
        element: 'Air',
        direction: 'East',
      },
      {
        id: 'beltane',
        name: 'Beltane',
        alt: 'May Day',
        type: 'cross',
        traditional: { north: '1 May', south: '31 October – 1 November' },
        angle: 135,
        icon: '🔥',
        color: '#e07020',
        colorDark: '#904010',
        desc: 'Beltane blazes with the full fire of spring becoming summer. Fires were lit on every hill; cattle driven between them for protection. Maypoles rose as symbols of sacred union, and the veil between worlds thinned, inviting the fae to walk among us.',
        traditions: ['Beltane Fires', 'Maypole Dance', 'Green Man', 'Handfasting'],
        themes: 'Passion, Union, Fertility at peak',
        element: 'Fire',
        direction: 'Southeast',
      },
      {
        id: 'litha',
        name: 'Litha',
        alt: 'Midsummer · Summer Solstice',
        type: 'solar',
        event: 'june_solstice',
        angle: 180,
        icon: '☀️',
        color: '#d4a020',
        colorDark: '#8a6010',
        desc: 'Litha is the zenith — the longest day, when the Sun pauses at the height of its power before beginning its slow descent. Midsummer bonfires burned through the night; faeries were said to roam freely. It is a moment of radiant fullness before the waning begins.',
        traditions: ['Midsummer Bonfires', 'Flower Crowns', 'Well Dressing', 'Sun Wheels'],
        themes: 'Fullness, Power, Celebration before waning',
        element: 'Fire & Air',
        direction: 'South',
      },
      {
        id: 'lughnasadh',
        name: 'Lughnasadh',
        alt: 'Lammas · First Harvest',
        type: 'cross',
        traditional: { north: '1 August', south: '1 February' },
        angle: 225,
        icon: '🌾',
        color: '#a0b030',
        colorDark: '#507010',
        desc: 'Lughnasadh, named for the god Lugh, marks the first harvest — grain cut, bread baked from new wheat. It is a time of both abundance and bittersweet awareness: the Sun King weakens as the harvest grows. Games, feasting, and sacrifice honored the turning year.',
        traditions: ['Bread Baking', 'Grain Dollies', 'Harvest Games', 'Offerings to Lugh'],
        themes: 'First harvest, Sacrifice, Abundance',
        element: 'Earth & Fire',
        direction: 'Southwest',
      },
      {
        id: 'mabon',
        name: 'Mabon',
        alt: 'Autumn Equinox',
        type: 'solar',
        event: 'september_equinox',
        angle: 270,
        icon: '🍂',
        color: '#b05820',
        colorDark: '#703010',
        desc: 'Mabon brings the second balance point of the year as darkness begins to gain. The second harvest is gathered; leaves catch flame in amber and crimson. Named for the Welsh divine child, this equinox invites gratitude for what has been reaped and release of what must fall.',
        traditions: ['Apple Harvest', 'Gratitude Altars', 'Ancestor Honoring', 'Wine Making'],
        themes: 'Balance, Gratitude, Preparation for darkness',
        element: 'Water & Air',
        direction: 'West',
      },
      {
        id: 'samhain',
        name: 'Samhain',
        alt: 'All Hallows · Ancestor Night',
        type: 'cross',
        traditional: { north: '31 October', south: '30 April – 1 May' },
        angle: 315,
        icon: '🌑',
        color: '#7040b0',
        colorDark: '#3a1870',
        desc: 'Samhain is the great hinge of the year — the end and the beginning, when the veil between the living and the dead grows thin as gossamer. The final harvest is brought in, the last fires extinguished and relit from the sacred flame. Ancestors are welcomed home.',
        traditions: ['Dumb Supper', 'Jack-o-Lanterns', 'Ancestor Altars', 'Divination'],
        themes: 'Death, Transition, Ancestral communion',
        element: 'Water',
        direction: 'Northwest',
      },
    ];

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const DAY = 1000 * 60 * 60 * 24;

    // Meeus's equinox and solstice coefficients, matching lib/almanac.rb
    const SOLAR_EVENT_COEFFICIENTS = {
      march_equinox: [2451623.80984, 365242.37404, 0.05169, -0.00411, -0.00057],
      june_solstice: [2451716.56767, 365241.62603, 0.00325, 0.00888, -0.00030],
      september_equinox: [2451810.21715, 365242.01767, -0.11575, 0.00337, 0.00078],
      december_solstice: [2451900.05952, 365242.74049, -0.06223, -0.00823, 0.00032],
    };

    // In the south each solar festival falls on the opposite solstice or equinox
    const SOUTHERN_EVENT = {
      december_solstice: 'june_solstice',
      june_solstice: 'december_solstice',
      march_equinox: 'september_equinox',
      september_equinox: 'march_equinox',
    };

    // Timezones south of the equator, for guessing the hemisphere on a first visit
    const SOUTHERN_TIMEZONES = /^(Australia|Antarctica)\/|^Pacific\/(Auckland|Chatham|Fiji|Tongatapu|Apia|Noumea|Efate|Port_Moresby)|^America\/(Argentina|Santiago|Sao_Paulo|Montevideo|Asuncion|La_Paz|Lima|Punta_Arenas)|^Africa\/(Johannesburg|Maputo|Harare|Windhoek|Gaborone|Lusaka|Maseru|Mbabane|Blantyre|Lubumbashi|Luanda|Dar_es_Salaam)|^Indian\/(Mauritius|Reunion|Antananarivo)|^Atlantic\/Stanley/;

    function storedHemisphere () {
      try {
        const stored = localStorage.getItem('wheel-of-the-year-hemisphere');
        if (stored === 'north' || stored === 'south') return stored;
      } catch (e) { /* storage unavailable */ }
      try {
        if (SOUTHERN_TIMEZONES.test(Intl.DateTimeFormat().resolvedOptions().timeZone)) return 'south';
      } catch (e) { /* no Intl */ }
      return 'north';
    }

    let hemisphere = storedHemisphere();

    const svg = document.getElementById('wheel-svg');
    const infoPanel = document.getElementById('info-panel');
    const panelPrompt = document.getElementById('panel-prompt');
    const panelContent = document.getElementById('panel-content');
    const nowLine = document.getElementById('now-line');

    const R_OUTER = 240;
    const R_RING = 140;
    const R_INNER = 70;

    function svgEl (tag, attrs) {
      const el = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
      return el;
    }

    function polarToXY (angleDeg, r) {
      // 0 deg = top, clockwise
      const rad = (angleDeg - 90) * Math.PI / 180;
      return [r * Math.cos(rad), r * Math.sin(rad)];
    }

    function describeArc (cx, cy, r, startAngle, endAngle) {
      const [x1, y1] = polarToXY(startAngle, r);
      const [x2, y2] = polarToXY(endAngle, r);
      const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
      return `M ${cx + x1} ${cy + y1} A ${r} ${r} 0 ${largeArc} 1 ${cx + x2} ${cy + y2}`;
    }

    // === DATES ===

    function solarInstant (event, year) {
      const [c0, c1, c2, c3, c4] = SOLAR_EVENT_COEFFICIENTS[event];
      const t = (year - 2000) / 1000;
      const jde = c0 + c1 * t + c2 * t ** 2 + c3 * t ** 3 + c4 * t ** 4;
      return new Date((jde - 2440587.5) * DAY);
    }

    // Every festival from two years back to two years on, in order. The cross-quarter days are the astronomical
    // midpoints between the solstices and equinoxes either side of them
    function festivalTimeline (hemi) {
      const thisYear = new Date().getFullYear();
      const solar = [];
      for (let year = thisYear - 2; year <= thisYear + 2; year++) {
        sabbats.forEach((s, index) => {
          if (!s.event) return;
          const event = hemi === 'south' ? SOUTHERN_EVENT[s.event] : s.event;
          solar.push({ index, date: solarInstant(event, year) });
        });
      }
      solar.sort((a, b) => a.date - b.date);

      const timeline = [];
      solar.forEach((a, i) => {
        timeline.push(a);
        const b = solar[i + 1];
        if (b) timeline.push({ index: (a.index + 1) % sabbats.length, date: new Date((a.date.getTime() + b.date.getTime()) / 2) });
      });
      return timeline;
    }

    function startOfDay (date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    // Whole calendar days from today to date, in the viewer's timezone
    function daysFromToday (date) {
      return Math.round((startOfDay(date) - startOfDay(new Date())) / DAY);
    }

    function relativeDays (days) {
      if (days === 0) return 'today';
      if (days === 1) return 'tomorrow';
      if (days === -1) return 'yesterday';
      return days > 0 ? `in ${days} days` : `${-days} days ago`;
    }

    const dateFormat = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
    const shortDateFormat = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });

    // The festival's next date, counting today
    function nextOccurrence (index) {
      return timeline.find(o => o.index === index && daysFromToday(o.date) >= 0);
    }

    // Where today falls on the wheel, between the last festival and the next
    function todayAngle () {
      const now = new Date();
      const i = timeline.findIndex(o => o.date > now);
      const prev = timeline[i - 1];
      const next = timeline[i];
      const fraction = (now - prev.date) / (next.date - prev.date);
      return sabbats[prev.index].angle + 45 * fraction;
    }

    function directionFor (direction) {
      if (hemisphere === 'north') return direction;
      return direction.replace(/North|South/g, d => (d === 'North' ? 'South' : 'North'));
    }

    let timeline = festivalTimeline(hemisphere);

    // === WHEEL ===

    function createSegment (sabbat, index) {
      const startAngle = sabbat.angle - 22.5;
      const endAngle = sabbat.angle + 22.5;

      const [ox1, oy1] = polarToXY(startAngle, R_OUTER);
      const [ox2, oy2] = polarToXY(endAngle, R_OUTER);
      const [ix1, iy1] = polarToXY(startAngle, R_RING);
      const [ix2, iy2] = polarToXY(endAngle, R_RING);

      const path = `M ${ox1} ${oy1} A ${R_OUTER} ${R_OUTER} 0 0 1 ${ox2} ${oy2} L ${ix2} ${iy2} A ${R_RING} ${R_RING} 0 0 0 ${ix1} ${iy1} Z`;

      const g = svgEl('g', {
        class: 'segment',
        tabindex: '0',
        role: 'button',
        'aria-pressed': 'false',
        'aria-label': `${sabbat.name}, ${sabbat.alt}`,
      });
      g.dataset.id = sabbat.id;

      g.appendChild(svgEl('path', { d: path, class: 'segment-fill', fill: sabbat.colorDark, stroke: '#0d0a06', 'stroke-width': '1.5' }));

      // Gradient overlay
      const gradId = `grad-${sabbat.id}`;
      const grad = svgEl('radialGradient', { id: gradId, cx: '50%', cy: '50%', r: '50%' });
      grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': sabbat.color, 'stop-opacity': '0.3' }));
      grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': sabbat.color, 'stop-opacity': '0' }));
      svg.querySelector('defs').appendChild(grad);
      g.appendChild(svgEl('path', { d: path, fill: `url(#${gradId})`, stroke: 'none' }));

      // Rim arc highlight
      g.appendChild(svgEl('path', {
        d: describeArc(0, 0, R_OUTER - 1, startAngle + 0.5, endAngle - 0.5),
        fill: 'none',
        stroke: sabbat.color,
        'stroke-width': '2.5',
        opacity: '0.6',
      }));

      // Type indicator (solar = diamond, cross-quarter = circle) at mid-outer edge
      const [mx, my] = polarToXY(sabbat.angle, R_OUTER - 12);
      if (sabbat.type === 'solar') {
        g.appendChild(svgEl('rect', { x: mx - 5, y: my - 5, width: 10, height: 10, transform: `rotate(45, ${mx}, ${my})`, fill: sabbat.color, opacity: '0.9' }));
      } else {
        g.appendChild(svgEl('circle', { cx: mx, cy: my, r: 5, fill: sabbat.color, opacity: '0.9' }));
      }

      // Name and next date, along the spoke, turned the right way up in the lower half of the wheel
      const [lx, ly] = polarToXY(sabbat.angle, (R_RING + R_OUTER) / 2 - 12);
      const upright = sabbat.angle > 90 && sabbat.angle < 270 ? sabbat.angle + 180 : sabbat.angle;
      const textG = svgEl('g', { transform: `translate(${lx}, ${ly}) rotate(${upright})` });
      const nameText = svgEl('text', { class: 'sabbat-label', x: 0, y: -5 });
      nameText.textContent = sabbat.name.toUpperCase();
      textG.appendChild(nameText);
      textG.appendChild(svgEl('text', { class: 'sabbat-label sabbat-date', x: 0, y: 9 }));
      g.appendChild(textG);

      g.addEventListener('click', () => selectSabbat(index));
      g.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectSabbat(index);
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          const step = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
          const next = (index + step + sabbats.length) % sabbats.length;
          segments()[next].focus();
          selectSabbat(next, { keep: true });
        } else if (e.key === 'Escape' && activeIndex !== null) {
          selectSabbat(activeIndex);
        }
      });
      return g;
    }

    function segments () {
      return Array.from(svg.querySelectorAll('.segment'));
    }

    function buildWheel () {
      svg.appendChild(svgEl('defs'));

      svg.appendChild(svgEl('circle', { cx: 0, cy: 0, r: R_OUTER, fill: '#0a0806', stroke: 'rgba(201,168,76,0.2)', 'stroke-width': '1' }));

      // Concentric decorative rings
      [R_RING, R_INNER + 30, R_INNER].forEach((r, i) => {
        svg.appendChild(svgEl('circle', { cx: 0, cy: 0, r, fill: 'none', stroke: `rgba(201,168,76,${i === 0 ? 0.35 : 0.2})`, 'stroke-width': i === 0 ? '1.5' : '0.8' }));
      });

      // Spoke lines (dividers)
      for (let i = 0; i < 8; i++) {
        const angle = i * 45 - 22.5;
        const [x1, y1] = polarToXY(angle, R_INNER);
        const [x2, y2] = polarToXY(angle, R_OUTER);
        svg.appendChild(svgEl('line', { x1, y1, x2, y2, stroke: 'rgba(201,168,76,0.25)', 'stroke-width': '0.8' }));
      }

      sabbats.forEach((s, i) => svg.appendChild(createSegment(s, i)));

      // Season labels in the inner ring. Spring (90°) and Autumn (270°) are pulled inward to clear the segments
      [[0, 'WINTER'], [90, 'SPRING'], [180, 'SUMMER'], [270, 'AUTUMN']].forEach(([angle, season]) => {
        const r = (angle === 90 || angle === 270) ? R_INNER + 32 : R_INNER + 50;
        const [sx, sy] = polarToXY(angle, r);
        const xOffset = (angle === 270) ? -4 : (angle === 90) ? 2 : 0;
        const t = svgEl('text', { class: 'season-label', x: sx + xOffset, y: sy });
        t.textContent = season;
        svg.appendChild(t);
      });

      // Solstice ticks
      [0, 180].forEach(angle => {
        const [x1, y1] = polarToXY(angle, R_INNER + 30);
        const [x2, y2] = polarToXY(angle, R_INNER + 38);
        svg.appendChild(svgEl('line', { x1, y1, x2, y2, stroke: 'rgba(201,168,76,0.5)', 'stroke-width': '1.5' }));
      });

      // Today's hand, from the centre out to the rim
      const marker = svgEl('g', { class: 'today-marker', id: 'today-marker' });
      marker.appendChild(svgEl('line', { x1: 0, y1: -R_INNER, x2: 0, y2: -(R_OUTER + 6), stroke: '#e8c96a', 'stroke-width': '1.5', 'stroke-linecap': 'round', opacity: '0.85' }));
      marker.appendChild(svgEl('circle', { cx: 0, cy: -(R_OUTER + 6), r: 4.5, fill: '#e8c96a', stroke: '#0d0a06', 'stroke-width': '1.5' }));
      const markerTitle = svgEl('title');
      markerTitle.textContent = 'Today';
      marker.appendChild(markerTitle);
      svg.appendChild(marker);

      // Centre, with the moon's phase
      svg.appendChild(svgEl('circle', { cx: 0, cy: 0, r: R_INNER, fill: '#0d0a06', stroke: 'rgba(201,168,76,0.5)', 'stroke-width': '1' }));

      const moon = getMoonPhase();
      const moonGlyph = svgEl('text', { x: 0, y: 2, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-family': 'serif', 'font-size': '26', fill: '#c4b89a' });
      moonGlyph.textContent = moon.emoji;
      svg.appendChild(moonGlyph);

      const moonLabel = svgEl('text', { x: 0, y: 28, 'text-anchor': 'middle', 'font-family': 'Cinzel, serif', 'font-size': '7', fill: '#c4b89a', 'letter-spacing': '1' });
      moonLabel.textContent = moon.name.toUpperCase();
      svg.appendChild(moonLabel);

      const moonNext = svgEl('text', { x: 0, y: -26, 'text-anchor': 'middle', 'font-family': 'EB Garamond, serif', 'font-style': 'italic', 'font-size': '9', fill: '#8a6f2e' });
      moonNext.textContent = moon.next;
      svg.appendChild(moonNext);
    }

    // Everything that depends on the hemisphere: the dates under the names, today's hand and the line under the title
    function updateDates () {
      timeline = festivalTimeline(hemisphere);

      segments().forEach((g, i) => {
        g.querySelector('.sabbat-date').textContent = shortDateFormat.format(nextOccurrence(i).date);
      });

      document.getElementById('today-marker').setAttribute('transform', `rotate(${todayAngle()})`);

      const next = timeline.find(o => daysFromToday(o.date) >= 0);
      const days = daysFromToday(next.date);
      const moon = getMoonPhase();
      nowLine.textContent = `${moon.emoji} ${moon.name} · `;
      const link = document.createElement('button');
      link.type = 'button';
      link.textContent = days === 0 ? `Happy ${sabbats[next.index].name}!` : `${sabbats[next.index].name} ${relativeDays(days)}`;
      link.addEventListener('click', () => {
        if (activeIndex !== next.index) selectSabbat(next.index);
      });
      nowLine.appendChild(link);
    }

    let activeIndex = null;

    function clearSelection () {
      activeIndex = null;
      segments().forEach(g => {
        g.classList.remove('active', 'dimmed');
        g.setAttribute('aria-pressed', 'false');
      });
      infoPanel.classList.remove('has-selection');
      panelPrompt.classList.remove('hidden');
      panelContent.classList.remove('visible');
      history.replaceState(null, '', location.pathname + location.search);
    }

    function selectSabbat (index, { keep } = {}) {
      if (activeIndex === index && !keep) {
        clearSelection();
        return;
      }
      activeIndex = index;

      segments().forEach((g, i) => {
        g.classList.toggle('active', i === index);
        g.classList.toggle('dimmed', i !== index);
        g.setAttribute('aria-pressed', i === index ? 'true' : 'false');
      });

      const s = sabbats[index];
      const next = nextOccurrence(index);
      const days = daysFromToday(next.date);
      const when = `<strong>${dateFormat.format(next.date)}</strong> · ${relativeDays(days)}`;
      const whenLines = s.type === 'solar'
        ? `<div class="panel-when">${when}</div>`
        : `<div class="panel-when">Traditionally ${s.traditional[hemisphere]}</div>
           <div class="panel-when">Astronomical midpoint ${when}</div>`;

      infoPanel.classList.add('has-selection');
      panelPrompt.classList.add('hidden');

      panelContent.innerHTML = `
    <div class="panel-header">
      <div class="panel-icon" style="color:${s.color}">${s.icon}</div>
      <div>
        <div class="panel-name">${s.name}</div>
        <div class="panel-alt">${s.alt}</div>
        <span class="panel-type-badge ${s.type === 'solar' ? 'badge-solar' : 'badge-cross'}">${s.type === 'solar' ? '◈ Solar Festival' : '● Cross-Quarter Day'}</span>
      </div>
    </div>
    <div>${whenLines}</div>
    <div class="panel-body">${s.desc}</div>
    <div class="detail-item">
      <div class="detail-label">Themes</div>
      <div class="detail-value">${s.themes}</div>
    </div>
    <div class="panel-details">
      <div class="detail-item">
        <div class="detail-label">Element</div>
        <div class="detail-value">${s.element}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Direction</div>
        <div class="detail-value">${directionFor(s.direction)}</div>
      </div>
    </div>
    <div>
      <div class="detail-label">Traditions</div>
      <div class="traditions-list">${s.traditions.map(t => `<span class="tradition-tag">${t}</span>`).join('')}</div>
    </div>
  `;

      panelContent.classList.add('visible');
      history.replaceState(null, '', `#${s.id}`);
    }

    function setHemisphere (hemi) {
      if (hemisphere === hemi) return;
      hemisphere = hemi;
      try { localStorage.setItem('wheel-of-the-year-hemisphere', hemi); } catch (e) { /* storage unavailable */ }
      showHemisphere();
    }

    function showHemisphere () {
      ['north', 'south'].forEach(h => {
        const btn = document.getElementById(h === 'north' ? 'btn-nh' : 'btn-sh');
        btn.classList.toggle('active', h === hemisphere);
        btn.setAttribute('aria-pressed', h === hemisphere ? 'true' : 'false');
      });
      updateDates();
      if (activeIndex !== null) selectSabbat(activeIndex, { keep: true });
    }

    function getMoonPhase () {
      // Synodic month and reference new moon matching lib/almanac.rb
      const LUNAR_MONTH = 29.530588853;
      const knownNewMoon = Date.UTC(2000, 0, 6, 6, 14, 0); // Jan 6, 2000 06:14 UTC
      const elapsedDays = (Date.now() - knownNewMoon) / DAY;
      const moonAge = ((elapsedDays % LUNAR_MONTH) + LUNAR_MONTH) % LUNAR_MONTH;

      // Phase boundaries matching lib/almanac.rb
      const phases = [
        { max: 1, name: 'New Moon', emoji: '🌑' },
        { max: 6.38, name: 'Waxing Crescent', emoji: '🌒' },
        { max: 8.38, name: 'First Quarter', emoji: '🌓' },
        { max: 13.76, name: 'Waxing Gibbous', emoji: '🌔' },
        { max: 15.76, name: 'Full Moon', emoji: '🌕' },
        { max: 21.14, name: 'Waning Gibbous', emoji: '🌖' },
        { max: 23.14, name: 'Last Quarter', emoji: '🌗' },
        { max: LUNAR_MONTH, name: 'Waning Crescent', emoji: '🌘' },
      ];
      const phase = phases.find(p => moonAge < p.max) || phases[0];

      // Days to the next full or new moon, whichever comes first (full at half a lunar month)
      const toFull = ((LUNAR_MONTH / 2 - moonAge) + LUNAR_MONTH) % LUNAR_MONTH;
      const toNew = LUNAR_MONTH - moonAge;
      const [days, which] = toFull < toNew ? [toFull, 'full'] : [toNew, 'new'];
      const rounded = Math.round(days);
      const next = rounded === 0 ? `${which} moon today` : `${which} moon in ${rounded} day${rounded === 1 ? '' : 's'}`;

      return { ...phase, next };
    }

    buildWheel();
    showHemisphere();

    // Open the festival in the URL (#samhain), or else the next one
    const linked = sabbats.findIndex(s => `#${s.id}` === location.hash);
    selectSabbat(linked >= 0 ? linked : timeline.find(o => daysFromToday(o.date) >= 0).index);
  </script>
</body>
