name: Ruby

on:
  # Claude Code's branches too, so its work is tested before it reaches master
  push:
    branches: [ master, 'claude/**' ]
  # Run workflow with coverage ticked (or `gh workflow run Ruby -f coverage=true`) measures test coverage too
  workflow_dispatch:
    inputs:
      coverage:
        description: Measure test coverage
        type: boolean
        default: false
      # Which routes each test requests (RECORD_ROUTES, test/setup/route_recording.rb), as each group's routes-<group> artifact,
      # for finding the tests that cover a route (covers_route). Every run records them, to check each covers_route; this
      # only saves them
      record_routes:
        description: Record which routes each test requests
        type: boolean
        default: false
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Each job has a time limit, so a step that hangs (a checkout that never finishes, say) fails in minutes rather than at
# GitHub's six hours
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    # RuboCop's results from earlier runs, so it only checks files that changed. A new Gemfile.lock, config or cop starts
    # afresh, as their hashes are in the key
    - name: Cache RuboCop's results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/rubocop_cache
        key: rubocop-${{ hashFiles('Gemfile.lock', '.rubocop.yml', '.rubocop/**') }}-${{ github.sha }}
        restore-keys: rubocop-${{ hashFiles('Gemfile.lock', '.rubocop.yml', '.rubocop/**') }}-

    # script/lint sets each linter's command and flags, for the pre-commit hook too
    - name: Run RuboCop
      run: script/lint --all --only rubocop

    - name: Run erb_lint
      run: script/lint --all --only erb_lint

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install linters
      run: npm ci

    - name: Run ESLint
      run: script/lint --all --only eslint

    - name: Run Stylelint
      run: script/lint --all --only stylelint

    - name: Run Herb
      run: script/lint --all --only herb

    # uvx runs the zizmor, actionlint and ShellCheck versions script/lint names, so its cache is keyed on that file
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.5
        cache-dependency-glob: script/lint

    # With GH_TOKEN, zizmor runs its online audits too (impostor commits, known-vulnerable actions, tag comments that
    # don't match their commits)
    - name: Run zizmor
      run: script/lint --all --only zizmor
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Run actionlint
      run: script/lint --all --only actionlint

    - name: Run ShellCheck
      run: script/lint --all --only shellcheck

    # Tests our own checks; here rather than in the test matrix, as it needs Node for the ESLint and Stylelint tests
    - name: Test the linters
      run: script/lint --all --only lint_test

  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-26.04
    # Two attempts at the tests' 10 minutes, and setting up
    timeout-minutes: 25
    env:
      MONGODB_VERSION: 8.2.12
      MONGODB_SHA256: 7489c024860eb33ee50190fba3ba75efca4a50d94265c4882de6c2d1751a9b88
    strategy:
      fail-fast: false
      # Each job runs a group of test files (test/**/*_test.rb, named by their path in test/, but lint_test.rb, which the
      # lint job runs) in one process.
      # GitHub's Free plan runs 20 jobs at once across the organisation, and a push also starts lint, CodeQL's 3 and
      # Sentry release, so the groups are at most 15 and all start together; each is kept under five minutes.
      # test/lint_test.rb checks each test file is in one group, and the number of groups
      matrix:
        include:
          - group: accounts
            files: accounts/accounts accounts/sign_ins accounts/password_sign_in_pauses accounts/email_confirmation accounts/provider_sign_ins accounts/privacy
          - group: calendar
            files: events/calendar events/evergreen events/listings events/boosts messages/comments integrations/atproto_events events/organisation_listings gatherings/gathering_routes
          - group: event_bookings
            files: bookings/bookings bookings/rules events/opencollective events/feedback_permissions
          - group: event_permissions
            files: events/permissions events/cohost_permissions
          - group: events
            files: events/events events/drafts events/content_safety events/hosts
          - group: gathering_features
            files: gatherings/features gatherings/rules
          - group: gatherings
            files: gatherings/gatherings gatherings/members
          - group: general
            files: dadmin design images search errands record_lock sentry stats_database stats_pages organisations/activity_applications messages/markup site_pages site_routes
          - group: integrations
            files: admin_pages integrations/mcp integrations/mcp_checkout integrations/whatsapp integrations/zapier integrations/webhooks integrations/analytics_providers events/admin_reports events/my_events accounts/account_routes organisations/organisation_routes
          - group: messages
            files: messages/messages messages/pmails messages/mailer events/feedbacks events/discussions messages/pmail_sending events/daily messages/email_templates
          - group: orders
            files: orders/orders orders/tokens orders/admin bookings/resales integrations/asn_blocking payments/dandelion_contributions
          - group: organisations
            files: organisations/organisations organisations/caches organisations/followers organisations/local_groups organisations/activities organisations/calendar_imports organisations/local_group_admin organisations/admin
          - group: payments
            files: payments/gocardless payments/mollie payments/paypal payments/stripe_connect payments/stripe_row_splitter payments/monthly_contributions orders/refunds bookings/donations organisations/payments payments/paypal_checkout payments/stripe_charges gatherings/payments messages/comment_routes
          - group: ticket_types
            files: bookings/ticket_types bookings/quotes bookings/waitlist bookings/discount_codes bookings/capacity_races events/event_admin_routes orders/ticket_admin
          - group: tours
            files: tours/tour tours/how_to_create_an_event tours/how_to_create_a_gathering gatherings/timetables gatherings/rotas gatherings/budget organisations/activity_admin organisations/local_group_routes
    steps:
    # mongod from MongoDB's own build, cached: a service container took about 17s to pull and create before the first step,
    # and docker run in the background still kept the tests waiting up to 22s. Restoring it takes a second or two, and
    # --fork returns once it accepts connections. Bump MONGODB_VERSION and MONGODB_SHA256 together, from
    # https://downloads.mongodb.org/full.json (the targeted ubuntu2404 x86_64 archive)
    - name: Cache MongoDB
      id: mongodb-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/mongodb
        key: mongodb-${{ env.MONGODB_VERSION }}-ubuntu2404-x86_64

    - name: Start MongoDB
      env:
        CACHE_HIT: ${{ steps.mongodb-cache.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" != true ]; then
          archive="mongodb-linux-x86_64-ubuntu2404-$MONGODB_VERSION"
          curl --fail --silent --show-error --location "https://fastdl.mongodb.org/linux/$archive.tgz" --output "$RUNNER_TEMP/mongodb.tgz"
          echo "$MONGODB_SHA256  $RUNNER_TEMP/mongodb.tgz" | sha256sum --check --quiet
          mkdir -p ~/mongodb
          tar --extract --gzip --file "$RUNNER_TEMP/mongodb.tgz" --directory ~/mongodb --strip-components 2 "$archive/bin/mongod"
        fi
        mkdir -p "$RUNNER_TEMP/mongodb-data"
        ~/mongodb/mongod --dbpath "$RUNNER_TEMP/mongodb-data" --bind_ip 127.0.0.1 --port 27017 --fork --logpath "$RUNNER_TEMP/mongod.log" ||
          { tail -n 30 "$RUNNER_TEMP/mongod.log"; exit 1; }

    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Chrome's first start on a fresh runner takes up to 30s, then its first page up to 13s more, as it reads itself and
    # its fonts from a cold disk (the timings test/setup/capybara.rb logs), and that lands on whichever browser test runs
    # first. Starting it once in the background now, while Ruby installs and the app boots, leaves them warm for the tests
    - name: Warm up Chrome
      run: |
        command -v google-chrome || { echo "::warning title=Warm up Chrome::No google-chrome on the runner, so Chrome starts cold in the tests"; exit 0; }
        (google-chrome --headless=new --no-first-run --disable-gpu --dump-dom 'data:text/html,<p style="font-family:sans-serif">Warm</p>' > /dev/null 2>&1 &)

    - name: Install Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    - name: Load env from .env.test.example
      run: |
        echo "CI=true" >> "$GITHUB_ENV"
        grep -v '^#' .env.test.example | grep -v '^$' | while IFS='=' read -r key value; do
          echo "$key=$value" >> "$GITHUB_ENV"
        done

    # The CDN and font files browser tests are answered with (test/setup/cdn_cache.rb), so a group downloads none. Their
    # URLs name versions, so a cached file never goes stale; a new one is downloaded once and saved with the next key
    - name: Cache CDN files
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tmp/cdn_cache
        key: cdn-cache-${{ hashFiles('frontend/integrity.json', 'app/views/layouts/_head.erb') }}
        restore-keys: cdn-cache-

    # Production's Dragonfly runs ImageMagick, and images_test.rb checks our policy against it; the runner has none
    - name: Install ImageMagick
      if: contains(format(' {0} ', matrix.files), ' images ')
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick

    # How long each of the group's files took in its last run, which rake test:parallel splits them by, and saves after.
    # A cache entry can't be overwritten, so each run saves its own and the next restores the newest; files with no time
    # yet are split by their number of tests
    - name: Cache test times
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tmp/test_times.json
        key: test-times-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: test-times-${{ matrix.group }}-

    # A failing test is retried on its own (TEST_ATTEMPTS in test/test_config.rb), so the group runs again only when it
    # hangs past the timeout, which those retries can't catch
    - name: Run tests (${{ matrix.files }})
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        TEST_FILES: ${{ matrix.files }}
        # Two runs at once: one is mostly one Ruby process and one Chrome, and the runner has 4 CPUs (rake test:parallel)
        TEST_PROCESSES: 2
        # Coverage (test/setup/coverage.rb) only when asked for, as it slows the groups and changes slowly
        COVERAGE: ${{ inputs.coverage && '1' || '' }}
        RECORD_ROUTES: ${{ inputs.record_routes && '1' || '' }}
      with:
        timeout_minutes: 10
        max_attempts: 2
        retry_on: timeout
        command: bundle exec rake test:parallel

    - name: Upload coverage
      if: ${{ !cancelled() && inputs.coverage }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ matrix.group }}
        path: coverage/.resultset.json
        include-hidden-files: true
        retention-days: 1

    - name: Upload the routes each test requested
      if: ${{ !cancelled() && inputs.record_routes }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: routes-${{ matrix.group }}
        path: tmp/routes
        retention-days: 1

  # The test groups' coverage in one report: its totals and least-covered files in the run's summary, and the whole report
  # in its coverage artifact
  coverage:
    needs: test
    if: ${{ !cancelled() && inputs.coverage }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    - name: Download the groups' coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-*
        path: coverage-groups

    - name: Collate coverage
      run: bundle exec rake test:coverage

    - name: Upload the coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: coverage
        retention-days: 14
