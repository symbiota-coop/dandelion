name: Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    # RuboCop's results from earlier runs, so it only checks files that changed. A new Gemfile.lock, config or cop starts
    # afresh, as their hashes are in the key
    - name: Cache RuboCop's results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/rubocop_cache
        key: rubocop-${{ hashFiles('Gemfile.lock', '.rubocop.yml', '.rubocop/**') }}-${{ github.sha }}
        restore-keys: rubocop-${{ hashFiles('Gemfile.lock', '.rubocop.yml', '.rubocop/**') }}-

    # script/lint sets each linter's command and flags, for the pre-commit hook too
    - name: Run RuboCop
      run: script/lint --all --only rubocop

    - name: Run erb_lint
      run: script/lint --all --only erb_lint

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install linters
      run: npm ci

    - name: Run ESLint
      run: script/lint --all --only eslint

    - name: Run Stylelint
      run: script/lint --all --only stylelint

    - name: Run Herb
      run: script/lint --all --only herb

    # uvx runs the zizmor, actionlint and ShellCheck versions script/lint names
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: 0.13.1

    # With GH_TOKEN, zizmor runs its online audits too (impostor commits, known-vulnerable actions, tag comments that
    # don't match their commits)
    - name: Run zizmor
      run: script/lint --all --only zizmor
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Run actionlint
      run: script/lint --all --only actionlint

    - name: Run ShellCheck
      run: script/lint --all --only shellcheck

    # Tests our own checks; here rather than in the test matrix, as it needs Node for the ESLint and Stylelint tests
    - name: Test the linters
      run: script/lint --all --only lint_test

  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mirror.gcr.io/library/mongo:8.2
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      # One job per test file (test/*_test.rb, but lint_test.rb, which the lint job runs), listed here rather than found by a
      # job of its own, which the tests had to wait for; test/lint_test.rb checks the list matches test/
      matrix:
        test_file:
          - accounts
          - activities
          - analytics_providers
          - calendar
          - dadmin
          - design
          - event_bookings
          - event_boosts
          - event_drafts
          - event_feedbacks
          - event_opencollective
          - event_permissions
          - events
          - evergreen_events
          - gatherings
          - how_to_create_a_gathering
          - how_to_create_an_event
          - local_groups
          - mcp
          - messages
          - orders
          - organisations
          - pmails
          - search
          - ticket_types
          - tour
          - waitlist
          - webhooks
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    - name: Load env from .env.test.example
      run: |
        echo "CI=true" >> "$GITHUB_ENV"
        grep -v '^#' .env.test.example | grep -v '^$' | while IFS='=' read -r key value; do
          echo "$key=$value" >> "$GITHUB_ENV"
        done

    - name: Run test (${{ matrix.test_file }})
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: bundle exec rake test:${{ matrix.test_file }}
