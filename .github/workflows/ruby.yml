name: Ruby

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.7
        bundler-cache: true

    # script/lint sets each linter's command and flags, for the pre-commit hook too
    - name: Run RuboCop
      run: script/lint --all --only rubocop

    - name: Run erb_lint
      run: script/lint --all --only erb_lint

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install linters
      run: npm ci

    - name: Run ESLint
      run: script/lint --all --only eslint

    - name: Run Stylelint
      run: script/lint --all --only stylelint

    # Tests our own checks; here rather than in the test matrix, as it needs Node for the ESLint and Stylelint tests
    - name: Test the linters
      run: bundle exec ruby -I test test/lint_test.rb

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.set-matrix.outputs.test_files }}
    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Generate test file matrix
      id: set-matrix
      run: |
        # Find all *_test.rb files and extract the base names (without _test.rb suffix). lint_test.rb runs in the lint job
        test_files=$(find test -name '*_test.rb' -not -name 'lint_test.rb' -type f | sed 's|test/||' | sed 's|_test.rb||' | sort | jq -R -s -c 'split("\n")[:-1]')
        echo "test_files=$test_files" >> $GITHUB_OUTPUT
        echo "Found test files: $test_files"

  test:
    needs: generate-matrix
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mirror.gcr.io/library/mongo:8.2
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.generate-matrix.outputs.test_files) }}
    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Install Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4.7
        bundler-cache: true

    - name: Load env from .env.test.example
      run: |
        echo "CI=true" >> $GITHUB_ENV
        grep -v '^#' .env.test.example | grep -v '^$' | while IFS='=' read -r key value; do
          echo "$key=$value" >> $GITHUB_ENV
        done

    - name: Run test (${{ matrix.test_file }})
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        command: bundle exec rake test:${{ matrix.test_file }}
