name: Ruby

on:
  # Claude Code's branches too, so its work is tested before it reaches master
  push:
    branches: [ master, 'claude/**' ]
  # Run workflow with coverage ticked (or `gh workflow run Ruby -f coverage=true`) measures test coverage too
  workflow_dispatch:
    inputs:
      coverage:
        description: Measure test coverage
        type: boolean
        default: false
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    # RuboCop's results from earlier runs, so it only checks files that changed. A new Gemfile.lock, config or cop starts
    # afresh, as their hashes are in the key
    - name: Cache RuboCop's results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/rubocop_cache
        key: rubocop-${{ hashFiles('Gemfile.lock', '.rubocop.yml', '.rubocop/**') }}-${{ github.sha }}
        restore-keys: rubocop-${{ hashFiles('Gemfile.lock', '.rubocop.yml', '.rubocop/**') }}-

    # script/lint sets each linter's command and flags, for the pre-commit hook too
    - name: Run RuboCop
      run: script/lint --all --only rubocop

    - name: Run erb_lint
      run: script/lint --all --only erb_lint

    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install linters
      run: npm ci

    - name: Run ESLint
      run: script/lint --all --only eslint

    - name: Run Stylelint
      run: script/lint --all --only stylelint

    - name: Run Herb
      run: script/lint --all --only herb

    # uvx runs the zizmor, actionlint and ShellCheck versions script/lint names, so its cache is keyed on that file
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.5
        cache-dependency-glob: script/lint

    # With GH_TOKEN, zizmor runs its online audits too (impostor commits, known-vulnerable actions, tag comments that
    # don't match their commits)
    - name: Run zizmor
      run: script/lint --all --only zizmor
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Run actionlint
      run: script/lint --all --only actionlint

    - name: Run ShellCheck
      run: script/lint --all --only shellcheck

    # Tests our own checks; here rather than in the test matrix, as it needs Node for the ESLint and Stylelint tests
    - name: Test the linters
      run: script/lint --all --only lint_test

  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-26.04
    services:
      mongodb:
        image: mirror.gcr.io/library/mongo:8.2
        ports:
          - 27017:27017
    strategy:
      fail-fast: false
      # Each job runs a group of test files (test/**/*_test.rb, named by their path in test/, but lint_test.rb, which the
      # lint job runs) in one process.
      # GitHub's Free plan runs 20 jobs at once across the organisation, and a push also starts lint, CodeQL's 3 and
      # Sentry release, so the groups are at most 15 and all start together; each is balanced to about two minutes.
      # test/lint_test.rb checks each test file is in one group, and the number of groups
      matrix:
        include:
          - group: accounts
            files: accounts/accounts accounts/sign_ins accounts/email_confirmation accounts/provider_sign_ins
          - group: calendar
            files: events/calendar events/evergreen events/listings events/boosts
          - group: event_bookings
            files: bookings/bookings bookings/rules events/opencollective
          - group: event_permissions
            files: events/permissions events/cohost_permissions
          - group: events
            files: events/events events/drafts events/content_safety events/hosts
          - group: gathering_features
            files: gatherings/features gatherings/rules
          - group: gatherings
            files: gatherings/gatherings gatherings/members
          - group: general
            files: dadmin design images search errands
          - group: integrations
            files: integrations/mcp integrations/mcp_checkout integrations/zapier integrations/webhooks integrations/analytics_providers
          - group: messages
            files: messages/messages messages/pmails messages/mailer events/feedbacks events/discussions
          - group: orders
            files: orders/orders orders/tokens orders/admin bookings/resales
          - group: organisations
            files: organisations/organisations organisations/caches organisations/followers organisations/local_groups organisations/activities
          - group: payments
            files: payments/gocardless payments/mollie payments/paypal payments/stripe_connect payments/stripe_row_splitter payments/monthly_contributions orders/refunds bookings/donations organisations/payments
          - group: ticket_types
            files: bookings/ticket_types bookings/quotes bookings/waitlist bookings/discount_codes
          - group: tours
            files: tours/tour tours/how_to_create_an_event tours/how_to_create_a_gathering
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    - name: Load env from .env.test.example
      run: |
        echo "CI=true" >> "$GITHUB_ENV"
        grep -v '^#' .env.test.example | grep -v '^$' | while IFS='=' read -r key value; do
          echo "$key=$value" >> "$GITHUB_ENV"
        done

    # Production's Dragonfly runs ImageMagick, and images_test.rb checks our policy against it; the runner has none
    - name: Install ImageMagick
      if: contains(format(' {0} ', matrix.files), ' images ')
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick

    # A failing test is retried on its own (TEST_ATTEMPTS in test/test_config.rb), so the group runs again only when it
    # hangs past the timeout, which those retries can't catch
    - name: Run tests (${{ matrix.files }})
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        TEST_FILES: ${{ matrix.files }}
        # Coverage (test/test_coverage.rb) only when asked for, as it slows the groups and changes slowly
        COVERAGE: ${{ inputs.coverage && '1' || '' }}
      with:
        timeout_minutes: 10
        max_attempts: 2
        retry_on: timeout
        command: bundle exec rake test:files

    - name: Upload coverage
      if: ${{ !cancelled() && inputs.coverage }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-${{ matrix.group }}
        path: coverage/.resultset.json
        include-hidden-files: true
        retention-days: 1

  # The test groups' coverage in one report: its totals and least-covered files in the run's summary, and the whole report
  # in its coverage artifact
  coverage:
    needs: test
    if: ${{ !cancelled() && inputs.coverage }}
    runs-on: ubuntu-26.04
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: 4.0.9
        bundler-cache: true

    - name: Download the groups' coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-*
        path: coverage-groups

    - name: Collate coverage
      run: bundle exec rake test:coverage

    - name: Upload the coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: coverage
        retention-days: 14
