name: Daily Bug Review (Claude)

concurrency:
  group: daily-bug-review-claude
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  bug-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load models
        run: grep -E "^[A-Z_]+=" .github/models.env >> "$GITHUB_ENV"

      - name: Setup
        id: setup
        uses: ./.github/actions/bug-review-setup

      - name: Load prompt
        if: steps.setup.outputs.has_commits == 'true'
        id: prompt
        uses: ./.github/actions/bug-review-prompt
        with:
          title_prefix: '[Claude] '
          git_log_cmd: ${{ steps.setup.outputs.git_log_cmd }}
          review_window: ${{ steps.setup.outputs.review_window }}

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        if: steps.setup.outputs.has_commits == 'true'
        with:
          show_full_output: true
          display_report: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --dangerously-skip-permissions
          prompt: ${{ steps.prompt.outputs.text }}
