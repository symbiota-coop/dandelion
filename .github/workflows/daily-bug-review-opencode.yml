name: Daily Bug Review (opencode)

concurrency:
  group: daily-bug-review-opencode
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  bug-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load models
        run: grep -E "^[A-Z_]+=" .github/models.env >> "$GITHUB_ENV"

      - name: Setup
        id: setup
        uses: ./.github/actions/bug-review-setup

      - name: Load prompt
        if: steps.setup.outputs.has_commits == 'true'
        id: prompt
        uses: ./.github/actions/bug-review-prompt
        with:
          title_prefix: '[opencode] '
          git_log_cmd: ${{ steps.setup.outputs.git_log_cmd }}
          review_window: ${{ steps.setup.outputs.review_window }}

      - name: Install opencode
        if: steps.setup.outputs.has_commits == 'true'
        run: npm install -g opencode-ai

      - name: Run bug review
        if: steps.setup.outputs.has_commits == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          GH_TOKEN: ${{ github.token }}
          PROMPT_TEXT: ${{ steps.prompt.outputs.text }}
        run: |
          opencode_log="$(mktemp)"
          opencode_err="$(mktemp)"

          # --auto approves every permission request (bash, writing /tmp/issue-body.md outside the checkout...), which
          # `opencode run` would otherwise reject, as there's no one to ask. --print-logs puts opencode's own warnings
          # and errors on stderr, as a model call that fails can otherwise end the run with no event to say why.
          # The JSON events are kept for the summary, and shown in the log as a trace of what it's doing
          set +e
          opencode run --auto --model "$OPENCODE_MODEL" \
            --format json \
            --print-logs --log-level WARN \
            "$PROMPT_TEXT" \
            2> >(tee "$opencode_err" >&2) | tee "$opencode_log" | jq --unbuffered -r -R '
              fromjson?
              | if .type == "text" then "\n" + .part.text + "\n"
                elif .type == "tool_use" then
                  "→ \(.part.tool): " + (.part.state.input | .command // .filePath // .pattern // tostring | tostring | .[0:300])
                  + (if .part.state.status == "error" then " (failed: \(.part.state.error // "" | tostring | .[0:300]))" else "" end)
                elif .type == "error" then "Error: " + (.error.data.message // .error | tostring)
                else empty end
            '
          opencode_status=${PIPESTATUS[0]}
          set -e

          # The final result is the text of the last step that wrote any (each step_start begins a step)
          final_result=$(jq -r -R -s '
            reduce (split("\n")[] | fromjson? | select(.type == "step_start" or .type == "text")) as $e
              ([""]; if $e.type == "step_start" then . + [""] else .[-1] += $e.part.text end)
            | map(select(test("\\S"))) | last // ""
          ' "$opencode_log")

          # opencode can exit 0 part-way through, when a step starts and never finishes. That review didn't happen, so
          # fail it, and the next run's review window still starts from the last run that finished
          finished=$(jq -r -R -s '
            [split("\n")[] | fromjson? | select(.type == "step_start" or .type == "step_finish")] | last
            | .type == "step_finish" and .part.reason == "stop"
          ' "$opencode_log")
          if [ "$opencode_status" -eq 0 ] && [ "$finished" != "true" ]; then
            echo "::error::opencode stopped part-way through the review, without finishing its last step."
            opencode_status=1
          fi

          {
            echo "## opencode Report"
            echo

            if [ -n "$final_result" ]; then
              echo "### Final Result"
              echo
              echo "$final_result"
            else
              echo "opencode did not return a final result."
            fi

            if [ "$opencode_status" -ne 0 ]; then
              echo
              echo "### Exit Status"
              echo
              if [ "$finished" = "true" ]; then
                echo "\`opencode\` exited with status \`$opencode_status\`."
              else
                echo "\`opencode\` stopped part-way through the review, without finishing its last step."
              fi

              if [ -s "$opencode_err" ]; then
                echo
                echo "### Error Output"
                echo
                echo '```text'
                tail -n 120 "$opencode_err"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$opencode_status"
