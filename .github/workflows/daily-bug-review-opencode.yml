name: Daily Bug Review (opencode)

concurrency:
  group: daily-bug-review-opencode
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  # Resolves the review window once, and lists the models in OPENCODE_MODELS for the review job to run one each
  setup:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      has_commits: ${{ steps.setup.outputs.has_commits }}
      git_log_cmd: ${{ steps.setup.outputs.git_log_cmd }}
      review_window: ${{ steps.setup.outputs.review_window }}
      models: ${{ steps.models.outputs.models }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: $/.github/actions/bug-review-setup

      # A model in OPENCODE_MODELS can name its effort (its --variant) after a colon: opencode-go/<model>:<effort>.
      # Models with no variants (`opencode models opencode-go --verbose`) name none, and run at their only level
      - name: List models
        id: models
        run: |
          models=$(grep -E '^OPENCODE_MODELS=' .github/models.env | cut -d= -f2- | jq -R -c '
            split(" ") | map(select(length > 0) | (capture("^(?<model>[^:]+):(?<effort>.+)$") // {model: ., effort: ""})
              | {model, effort, name: (.model | sub("^[^/]*/"; ""))}
              | .label = ([.name, .effort] | map(select(length > 0)) | join(", ")))
          ')
          if [ "$(jq length <<< "$models")" -eq 0 ]; then
            echo "::error::OPENCODE_MODELS in .github/models.env lists no models."
            exit 1
          fi
          echo "models=$models" >> "$GITHUB_OUTPUT"

  bug-review:
    needs: setup
    if: needs.setup.outputs.has_commits == 'true'
    name: bug-review (${{ matrix.model.label }})
    strategy:
      # Each model's review stands alone, so one failing doesn't cancel the others
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.setup.outputs.models) }}
    runs-on: ubuntu-26.04
    # A review takes up to about half an hour, so one still going after an hour has hung: fail it then rather than
    # at GitHub's default of 6 hours
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Issues are titled with the model, less its provider (e.g. [opencode gemini-4-argon]), so each model's issues
      # can be told apart
      - name: Load prompt
        id: prompt
        uses: $/.github/actions/bug-review-prompt
        with:
          title_prefix: '[opencode ${{ matrix.model.name }}] '
          git_log_cmd: ${{ needs.setup.outputs.git_log_cmd }}
          review_window: ${{ needs.setup.outputs.review_window }}

      - name: Install opencode
        run: npm install -g opencode-ai --before="$(date -u -d "7 days ago" +%F)" # zizmor: ignore[adhoc-packages] -- the latest release at least 7 days old (the cooldown), so new models work

      - name: Run bug review
        env:
          OPENCODE_MODEL: ${{ matrix.model.model }}
          OPENCODE_EFFORT: ${{ matrix.model.effort }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          GH_TOKEN: ${{ github.token }}
          PROMPT_TEXT: ${{ steps.prompt.outputs.text }}
        run: |
          opencode_log="$(mktemp)"
          opencode_err="$(mktemp)"
          stream_error="$(mktemp -u)"

          # --auto approves every permission request (bash, writing /tmp/issue-body.md outside the checkout...), which
          # `opencode run` would otherwise reject, as there's no one to ask. --print-logs puts opencode's own warnings
          # and errors on stderr, as a model call that fails can otherwise end the run with no event to say why.
          # When the main (build) agent's model call fails for good (a stream error, e.g. Too Many Requests once its
          # retries run out), opencode logs it and then waits forever rather than exiting, until the job's timeout
          # cancels it hours later, so stop it there. (awk reads on to the end, so tee never writes to a closed pipe.)
          # The JSON events are kept for the summary, and shown in the log as a trace of what it's doing
          variant=()
          if [ -n "$OPENCODE_EFFORT" ]; then
            variant=(--variant "$OPENCODE_EFFORT")
          fi
          set +e
          opencode run --auto --model "$OPENCODE_MODEL" "${variant[@]}" \
            --format json \
            --print-logs --log-level WARN \
            "$PROMPT_TEXT" \
            2> >(tee "$opencode_err" >(awk -v flag="$stream_error" '
              !done && /level=ERROR/ && /message="stream error"/ && /agent=build/ {
                done = 1; system("touch \"" flag "\"; pkill -x opencode")
              }') >&2) | tee "$opencode_log" | jq --unbuffered -r -R '
              fromjson?
              | if .type == "text" then "\n" + .part.text + "\n"
                elif .type == "tool_use" then
                  "→ \(.part.tool): " + (.part.state.input | .command // .filePath // .pattern // tostring | tostring | .[0:300])
                  + (if .part.state.status == "error" then " (failed: \(.part.state.error // "" | tostring | .[0:300]))" else "" end)
                elif .type == "error" then "Error: " + (.error.data.message // .error | tostring)
                else empty end
            '
          opencode_status=${PIPESTATUS[0]}
          set -e

          # The final result is the text of the last step that wrote any (each step_start begins a step)
          final_result=$(jq -r -R -s '
            reduce (split("\n")[] | fromjson? | select(.type == "step_start" or .type == "text")) as $e
              ([""]; if $e.type == "step_start" then . + [""] else .[-1] += $e.part.text end)
            | map(select(test("\\S"))) | last // ""
          ' "$opencode_log")

          # opencode can exit 0 part-way through, when a step starts and never finishes. That review didn't happen, so
          # fail it, and the next run's review window still starts from the last run that finished
          finished=$(jq -r -R -s '
            [split("\n")[] | fromjson? | select(.type == "step_start" or .type == "step_finish")] | last
            | .type == "step_finish" and .part.reason == "stop"
          ' "$opencode_log")
          if [ -e "$stream_error" ]; then
            echo "::error::opencode's model call failed (see the stream error above), so it was stopped rather than left waiting."
            opencode_status=1
            finished=false
          elif [ "$opencode_status" -eq 0 ] && [ "$finished" != "true" ]; then
            echo "::error::opencode stopped part-way through the review, without finishing its last step."
            opencode_status=1
          fi

          {
            echo "## opencode Report ($OPENCODE_MODEL${OPENCODE_EFFORT:+, $OPENCODE_EFFORT})"
            echo

            if [ -n "$final_result" ]; then
              echo "### Final Result"
              echo
              echo "$final_result"
            else
              echo "opencode did not return a final result."
            fi

            if [ "$opencode_status" -ne 0 ]; then
              echo
              echo "### Exit Status"
              echo
              if [ "$finished" = "true" ]; then
                echo "\`opencode\` exited with status \`$opencode_status\`."
              else
                echo "\`opencode\` stopped part-way through the review, without finishing its last step."
              fi

              if [ -s "$opencode_err" ]; then
                echo
                echo "### Error Output"
                echo
                echo '```text'
                tail -n 120 "$opencode_err"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$opencode_status"
