# actionlint's config (script/lint runs it on the workflows)
self-hosted-runner:
  # GitHub's Ubuntu 26.04 runner, which actionlint (1.7.12) doesn't know yet. Drop this once it does
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/*.{yml,yaml}:
    ignore:
      # Our own actions use GitHub's $/ self-repository syntax (zizmor's self-repository audit), which actionlint doesn't
      # know yet
      - 'specifying action "\$/.+" in invalid format because ref is missing'
