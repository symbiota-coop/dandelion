# Dependabot proposes updates to the packages the app loads from jsDelivr (frontend/package.json). Nothing installs
# them: config/frontend_dependencies.rb reads the versions. A proposed version's files have no hash yet, so its PR fails
# CI's lint job until someone checks out the branch, runs rake frontend:integrity and commits the hashes it writes to
# frontend/integrity.json (AGENTS.md, Dependencies)
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # AGENTS.md's cooldown: no version released less than 7 days ago
    cooldown:
      default-days: 7
    # One PR for the minor and patch updates, which need one rake frontend:integrity run between them; majors come one by one
    groups:
      frontend:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
