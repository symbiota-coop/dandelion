name: Load bug review prompt
description: Read the shared daily bug review prompt into a step output

inputs:
  title_prefix:
    description: Issue title prefix (e.g. "[Claude] " or "[Cursor] ")
    required: true
  git_log_cmd:
    description: git log command that lists commits in the review window
    required: true
  review_window:
    description: Human-readable description of the review window
    required: true

outputs:
  text:
    description: The bug review prompt text
    value: ${{ steps.load.outputs.text }}

runs:
  using: composite
  steps:
    - name: Load prompt
      id: load
      shell: bash
      env:
        TITLE_PREFIX: ${{ inputs.title_prefix }}
        GIT_LOG_CMD: ${{ inputs.git_log_cmd }}
        REVIEW_WINDOW: ${{ inputs.review_window }}
      run: |
        PROMPT=$(<.github/prompts/daily-bug-review.md)
        PROMPT=${PROMPT//TITLE_PREFIX/$TITLE_PREFIX}
        PROMPT=${PROMPT//GIT_LOG_CMD/$GIT_LOG_CMD}
        PROMPT=${PROMPT//REVIEW_WINDOW/$REVIEW_WINDOW}
        {
          echo 'text<<EOF'
          echo "$PROMPT"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
