# Only cops that can fail CI (warning or above, as CI runs RuboCop with --fail-level warning): Lint, Security, ours and
# the three warning-level Layout cops, and the Style and Minitest cops raised to warning below. Other convention cops
# (Style, Layout, Naming, Minitest) are off, so plain `rubocop` reports what CI does.
# .erb_lint.yml inherits this file for the Ruby in templates.

# Our own cops (.rubocop/dandelion), each explaining its rule in its doc comment
require:
  - ./.rubocop/dandelion.rb

plugins:
  - rubocop-minitest

AllCops:
  NewCops: enable

Style:
  Enabled: false
Layout:
  Enabled: false
Naming:
  Enabled: false
Metrics:
  Enabled: false
# Only the cops below that catch tests that don't test what they seem to; the rest are assertion style
Minitest:
  Enabled: false
Layout/BeginEndAlignment:
  Enabled: true
Layout/DefEndAlignment:
  Enabled: true
Layout/EndAlignment:
  Enabled: true
  AutoCorrect: true

# Eval, YAML.load, Marshal.load, Kernel#open... are convention-level by default; warning, so they fail CI
Security:
  Severity: warning

# Convention cops that catch bugs, raised to warning so they fail CI
# and/or bind more loosely than =, so `ok = a and b` sets ok to a
Style/AndOr:
  Enabled: true
  Severity: warning
# A rescue modifier rescues every StandardError, so a typo's NoMethodError looks like bad input
Style/RescueModifier:
  Enabled: true
  Severity: warning
# A bare rescue catches every StandardError, so a typo's NoMethodError looks like bad input
Style/RescueStandardError:
  Enabled: true
  Severity: warning
# Puma runs threads, so a constant that changes is state shared across requests
Style/MutableConstant:
  Enabled: true
  Severity: warning
# ostruct isn't a default gem since Ruby 3.5, and OpenStruct answers nil to anything, so a stub hides what code reads
Style/OpenStructUse:
  Enabled: true
  Severity: warning

# Tests that don't test what they seem to: expected and actual swapped (so a failure reads backwards), a test method
# Minitest won't run, a duplicate or unreachable assertion, an assertion in setup, return or skip in the wrong place
Minitest/LiteralAsActualArgument:
  Enabled: true
  Severity: warning
Minitest/NonPublicTestMethod:
  Enabled: true
  Severity: warning
Minitest/DuplicateTestRun:
  Enabled: true
  Severity: warning
Minitest/UnreachableAssertion:
  Enabled: true
  Severity: warning
Minitest/UselessAssertion:
  Enabled: true
  Severity: warning
Minitest/AssertionInLifecycleHook:
  Enabled: true
  Severity: warning
Minitest/ReturnInTestMethod:
  Enabled: true
  Severity: warning
Minitest/SkipEnsure:
  Enabled: true
  Severity: warning
Minitest/AssertRaisesWithRegexpArgument:
  Enabled: true
  Severity: warning
Minitest/AssertRaisesCompoundBody:
  Enabled: true
  Severity: warning

# Our tests save screenshots on purpose (each test's last page, in capybara/<pid>/, and the how-to videos' frames), so
# save_screenshot isn't a debugging leftover; the rest of Capybara's list (save_and_open_page...) still is
Lint/Debugger:
  DebuggerMethods:
    Capybara:
      - page.save_and_open_page
      - page.save_and_open_screenshot
      - page.save_page
      - save_and_open_page
      - save_and_open_screenshot
      - save_page

# Warning, so they fail CI, in templates too
Dandelion:
  Severity: warning
Dandelion/RailsController:
  Include:
    - app/controllers/**/*.rb
Dandelion/SlugLookup:
  Include:
    - app/controllers/**/*.rb
Dandelion/GatheringScope:
  Include:
    - app/controllers/**/*.rb
Dandelion/CapybaraHasNoAfterClick:
  Include:
    - test/**/*.rb
Dandelion/MongoidIndex:
  Include:
    - models/**/*.rb
Dandelion/TestInstanceVariable:
  Include:
    - test/**/*_test.rb
Dandelion/CapybaraCurrentPath:
  Include:
    - test/**/*_test.rb
Dandelion/TestOneParadigm:
  Include:
    - test/**/*_test.rb
Dandelion/TestUnusedParadigm:
  Include:
    - test/**/*_test.rb
# The one place that uses Redcarpet, for everything else
Dandelion/Redcarpet:
  Exclude:
    - lib/markdown_renderer.rb
