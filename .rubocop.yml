# Only cops that can fail CI (warning or above, as CI runs RuboCop with --fail-level warning): Lint, Security, ours and
# the three warning-level Layout cops, and the Style cops raised to warning below. Other convention cops (Style, Layout,
# Naming) are off, so plain `rubocop` reports what CI does.
# .erb_lint.yml inherits this file for the Ruby in templates.

# Our own cops (.rubocop/dandelion), which check rules from AGENTS.md
require:
  - ./.rubocop/dandelion.rb

AllCops:
  NewCops: enable

Style:
  Enabled: false
Layout:
  Enabled: false
Naming:
  Enabled: false
Metrics:
  Enabled: false
Layout/BeginEndAlignment:
  Enabled: true
Layout/DefEndAlignment:
  Enabled: true
Layout/EndAlignment:
  Enabled: true
  AutoCorrect: true

# Eval, YAML.load, Marshal.load, Kernel#open... are convention-level by default; warning, so they fail CI
Security:
  Severity: warning

# Convention cops that catch bugs, raised to warning so they fail CI
# Puma runs threads, so a constant that changes is state shared across requests
Style/MutableConstant:
  Enabled: true
  Severity: warning

# Our tests save screenshots on purpose (each test's last page, in capybara/<pid>/, and the how-to videos' frames), so
# save_screenshot isn't a debugging leftover; the rest of Capybara's list (save_and_open_page...) still is
Lint/Debugger:
  DebuggerMethods:
    Capybara:
      - page.save_and_open_page
      - page.save_and_open_screenshot
      - page.save_page
      - save_and_open_page
      - save_and_open_screenshot
      - save_page

# Warning, so they fail CI, in templates too
Dandelion:
  Severity: warning
Dandelion/RailsController:
  Include:
    - app/controllers/**/*.rb
Dandelion/CapybaraHasNoAfterClick:
  Include:
    - test/**/*.rb
Dandelion/MongoidIndex:
  Include:
    - models/**/*.rb
Dandelion/TestInstanceVariable:
  Include:
    - test/**/*_test.rb
Dandelion/CapybaraCurrentPath:
  Include:
    - test/**/*_test.rb
# The one place that uses Redcarpet, for everything else
Dandelion/Redcarpet:
  Exclude:
    - lib/markdown_renderer.rb
