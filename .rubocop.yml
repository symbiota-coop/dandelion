# CI runs RuboCop with --fail-level warning, so only warning-level cops (mostly Lint) fail it; convention cops (Layout, Style, Naming) are reported but don't.
# .erb_lint.yml inherits this file for the Ruby in templates, but runs only the warning-level cops there, so convention cops set here don't reach templates.

AllCops:
  NewCops: enable 
Layout/EndAlignment:
  AutoCorrect: true
Style/SymbolArray:
  MinSize: 3
Style/HashSyntax:
  EnforcedShorthandSyntax: never 

Metrics:
  Enabled: false

Layout/LineLength:
  Enabled: false  

Style/FrozenStringLiteralComment:
  Enabled: false
Style/SafeNavigation:
  Enabled: false
Style/FetchEnvVar:
  Enabled: false
Style/HashLikeCase:
  Enabled: false  
Style/Documentation:
  Enabled: false
Style/OpenStructUse:
  Enabled: false  
Style/NumericPredicate:
  Enabled: false

Lint/DuplicateBranch:
  IgnoreDuplicateElseBranch: true
