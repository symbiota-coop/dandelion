# Only cops that can fail CI (warning or above, as CI runs RuboCop with --fail-level warning): Lint, Security, ours and
# the three warning-level Layout cops, and the Style and Minitest cops raised to warning below. Other convention cops
# (Style, Layout, Naming, Minitest) are off, so plain `rubocop` reports what CI does.
# .erb_lint.yml inherits this file for the Ruby in templates.

# Our own cops (.rubocop/dandelion), each explaining its rule in its doc comment
require:
  - ./.rubocop/dandelion.rb

plugins:
  - rubocop-minitest

AllCops:
  NewCops: enable

Style:
  Enabled: false
Layout:
  Enabled: false
Naming:
  Enabled: false
Metrics:
  Enabled: false
# Only the cops below: those that catch tests that don't test what they seem to, and those whose assertion says what
# it checks without changing what passes
Minitest:
  Enabled: false
Layout/BeginEndAlignment:
  Enabled: true
Layout/DefEndAlignment:
  Enabled: true
Layout/EndAlignment:
  Enabled: true
  AutoCorrect: true

# Eval, YAML.load, Marshal.load, Kernel#open... are convention-level by default; warning, so they fail CI
Security:
  Severity: warning

# Convention cops that catch bugs, raised to warning so they fail CI
# and/or bind more loosely than =, so `ok = a and b` sets ok to a
Style/AndOr:
  Enabled: true
  EnforcedStyle: always
  Severity: warning
# A rescue modifier rescues every StandardError, so a typo's NoMethodError looks like bad input
Style/RescueModifier:
  Enabled: true
  Severity: warning
# A bare rescue catches every StandardError, so a typo's NoMethodError looks like bad input
Style/RescueStandardError:
  Enabled: true
  Severity: warning
# Puma runs threads, so a constant that changes is state shared across requests
Style/MutableConstant:
  Enabled: true
  Severity: warning
# ostruct isn't a default gem since Ruby 3.5, and OpenStruct answers nil to anything, so a stub hides what code reads
Style/OpenStructUse:
  Enabled: true
  Severity: warning

# Tests that don't test what they seem to: expected and actual swapped (so a failure reads backwards), a test method
# Minitest won't run, a duplicate or unreachable assertion, an assertion in setup, return or skip in the wrong place
Minitest/LiteralAsActualArgument:
  Enabled: true
  Severity: warning
Minitest/NonPublicTestMethod:
  Enabled: true
  Severity: warning
Minitest/DuplicateTestRun:
  Enabled: true
  Severity: warning
Minitest/UnreachableAssertion:
  Enabled: true
  Severity: warning
Minitest/UselessAssertion:
  Enabled: true
  Severity: warning
Minitest/AssertionInLifecycleHook:
  Enabled: true
  Severity: warning
Minitest/ReturnInTestMethod:
  Enabled: true
  Severity: warning
Minitest/SkipEnsure:
  Enabled: true
  Severity: warning
Minitest/AssertRaisesWithRegexpArgument:
  Enabled: true
  Severity: warning
Minitest/AssertRaisesCompoundBody:
  Enabled: true
  Severity: warning

# One way to write each assertion, the one whose failure message shows the values: assert_empty x over
# assert x.empty?, assert_includes over include?... Only those whose fix passes and fails on the same values. Not:
# - AssertPredicate and RefutePredicate: assert_predicate x, :valid? reads worse than assert x.valid?, and its message
#   inspects a whole Mongoid document
# - AssertTruthy and RefuteFalse: assert_equal true, x to assert x would pass on any truthy value, and false to refute
#   on nil
# - AssertEmptyLiteral: assert_equal [], x to assert_empty x would pass on {} or ''
# - AssertInDelta and RefuteInDelta: assert_in_delta's 0.001 would pass a total of 23.3304 where 23.33 was expected,
#   and our amounts are exact to the cent
# - AssertEqual: assert(a == b) to assert_equal a, b fails when both are nil, as assert_equal refuses an expected nil
Minitest/AssertEmpty:
  Enabled: true
  Severity: warning
Minitest/AssertIncludes:
  Enabled: true
  Severity: warning
Minitest/AssertInstanceOf:
  Enabled: true
  Severity: warning
Minitest/AssertKindOf:
  Enabled: true
  Severity: warning
Minitest/AssertMatch:
  Enabled: true
  Severity: warning
Minitest/AssertNil:
  Enabled: true
  Severity: warning
Minitest/AssertOperator:
  Enabled: true
  Severity: warning
Minitest/AssertPathExists:
  Enabled: true
  Severity: warning
Minitest/AssertRespondTo:
  Enabled: true
  Severity: warning
Minitest/AssertSame:
  Enabled: true
  Severity: warning
Minitest/RefuteEmpty:
  Enabled: true
  Severity: warning
Minitest/RefuteEqual:
  Enabled: true
  Severity: warning
Minitest/RefuteIncludes:
  Enabled: true
  Severity: warning
Minitest/RefuteInstanceOf:
  Enabled: true
  Severity: warning
Minitest/RefuteKindOf:
  Enabled: true
  Severity: warning
Minitest/RefuteMatch:
  Enabled: true
  Severity: warning
Minitest/RefuteNil:
  Enabled: true
  Severity: warning
Minitest/RefuteOperator:
  Enabled: true
  Severity: warning
Minitest/RefutePathExists:
  Enabled: true
  Severity: warning
Minitest/RefuteRespondTo:
  Enabled: true
  Severity: warning
Minitest/RefuteSame:
  Enabled: true
  Severity: warning

# Our tests save screenshots on purpose (each test's last page, in capybara/<pid>/, and the how-to videos' frames), so
# save_screenshot isn't a debugging leftover; the rest of Capybara's list (save_and_open_page...) still is
Lint/Debugger:
  DebuggerMethods:
    Capybara:
      - page.save_and_open_page
      - page.save_and_open_screenshot
      - page.save_page
      - save_and_open_page
      - save_and_open_screenshot
      - save_page

# Warning, so they fail CI, in templates too
Dandelion:
  Severity: warning
Dandelion/RailsController:
  Include:
    - app/controllers/**/*.rb
Dandelion/SlugLookup:
  Include:
    - app/controllers/**/*.rb
Dandelion/GatheringScope:
  Include:
    - app/controllers/**/*.rb
Dandelion/GatheringPermission:
  Include:
    - app/controllers/**/*.rb
Dandelion/RouteAccess:
  Include:
    - app/app.rb
    - app/controllers/**/*.rb
Dandelion/AssertReload:
  Include:
    - test/**/*.rb
Dandelion/CapybaraHasNoAfterClick:
  Include:
    - test/**/*.rb
Dandelion/RefuteNot:
  Include:
    - test/**/*.rb
Dandelion/MongoidIndex:
  Include:
    - models/**/*.rb
Dandelion/CallbackDefault:
  Include:
    - models/**/*.rb
Dandelion/ConcernInclude:
  Include:
    - models/concerns/**/*.rb
Dandelion/CapybaraTabAfterFillIn:
  Include:
    - test/**/*.rb
Dandelion/TestInstanceVariable:
  Include:
    - test/**/*_test.rb
Dandelion/CapybaraCurrentPath:
  Include:
    - test/**/*_test.rb
Dandelion/TestOneParadigm:
  Include:
    - test/**/*_test.rb
Dandelion/TestUnusedParadigm:
  Include:
    - test/**/*_test.rb
# The shared helpers in test/helpers are where what it flags is done
Dandelion/TestSharedHelper:
  Include:
    - test/**/*_test.rb
# Mailer and the Mailgun stats in lib/mail use Mailgun themselves, for everything else
Dandelion/MailgunDirect:
  Exclude:
    - lib/mail/**/*.rb
# The one place that uses Redcarpet, for everything else
Dandelion/Redcarpet:
  Exclude:
    - lib/markdown_renderer.rb
# The emails' own nl2br (email templates don't have the app's helpers), for everything else
Dandelion/EscapedLineBreaks:
  Exclude:
    - lib/mail/email_helper.rb
