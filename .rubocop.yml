# CI runs RuboCop with --fail-level warning, so only warning-level cops (mostly Lint) fail it; convention cops (Layout, Style, Naming) are reported but don't.
# .erb_lint.yml inherits this file for the Ruby in templates, but runs only the warning-level cops there, so convention cops set here don't reach templates.

# Our own cops (.rubocop/dandelion), which check rules from AGENTS.md
require:
  - ./.rubocop/dandelion.rb

AllCops:
  NewCops: enable 
Layout/EndAlignment:
  AutoCorrect: true
Style/SymbolArray:
  MinSize: 3
Style/HashSyntax:
  EnforcedShorthandSyntax: never 

Metrics:
  Enabled: false

Layout/LineLength:
  Enabled: false  

Style/FrozenStringLiteralComment:
  Enabled: false
Style/SafeNavigation:
  Enabled: false
Style/FetchEnvVar:
  Enabled: false
Style/HashLikeCase:
  Enabled: false  
Style/Documentation:
  Enabled: false
Style/OpenStructUse:
  Enabled: false  
Style/NumericPredicate:
  Enabled: false

Lint/DuplicateBranch:
  IgnoreDuplicateElseBranch: true
# Our tests save screenshots on purpose (each test's last page, in capybara/<pid>/, and the how-to videos' frames), so
# save_screenshot isn't a debugging leftover; the rest of Capybara's list (save_and_open_page...) still is
Lint/Debugger:
  DebuggerMethods:
    Capybara:
      - page.save_and_open_page
      - page.save_and_open_screenshot
      - page.save_page
      - save_and_open_page
      - save_and_open_screenshot
      - save_page

# Warning, so they fail CI, in templates too
Dandelion:
  Severity: warning
Dandelion/RailsController:
  Include:
    - app/controllers/**/*.rb
Dandelion/CapybaraHasNoAfterClick:
  Include:
    - test/**/*.rb
Dandelion/MongoidIndex:
  Include:
    - models/**/*.rb
Dandelion/TestInstanceVariable:
  Include:
    - test/**/*_test.rb
Dandelion/CapybaraCurrentPath:
  Include:
    - test/**/*_test.rb
