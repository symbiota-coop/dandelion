---
glob: "app/views/**/*.erb"
EnableDefaultLinters: true
linters:
  # Forces an autocomplete attribute on every input; we add one only where it helps
  RequireInputAutocomplete:
    enabled: false
  AllowedScriptType:
    enabled: true
    allowed_types:
      - text/javascript
      - module
      - text/plain # held back until cookie consent (cookie_consent.js)
      - application/json
      - application/ld+json
  # Flags all literal text, for translation, which we don't do
  HardCodedString:
    enabled: false
  # Replaced by SafeErb (.erb_linters/safe_erb.rb), which leaves script types to AllowedScriptType
  ErbSafety:
    enabled: false
  # Checks for unsafe interpolation into JavaScript and attributes
  SafeErb:
    enabled: true
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      # Only cops that can fail CI (warning or above): erb_lint prints the offenses --fail-level ignores, so convention cops would fill the output
      Layout:
        Enabled: false
      Style:
        Enabled: false
      Naming:
        Enabled: false
      Layout/BeginEndAlignment:
        Enabled: true
      Layout/DefEndAlignment:
        Enabled: true
      Layout/EndAlignment:
        Enabled: true
      Lint/UselessAssignment:
        Enabled: false
